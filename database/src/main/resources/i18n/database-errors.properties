# Messages users see for the database module's errors, in English. Also the fallback for languages the app doesn't have.
# Translations are in the files with a language suffix; MessageBundlesTests checks they all have the same keys.
# {0}, {1}... are the exception's arguments. Write apostrophes as ’: next to placeholders, ' is a quote character.

error.DATABASE-001=That isn’t the database’s current password.
error.DATABASE-002=The new password is too short: at least {0} characters.
error.DATABASE-003=The new password is too long: at most {0} characters.
error.DATABASE-004=That’s the current password: type a new one.
error.DATABASE-005=JobWarden can’t change this database’s password: its connections don’t come from the pool it comes with.
error.DATABASE-006=The database refused the new password, so nothing changed: {0}
error.DATABASE-007=Nothing changed: the new password couldn’t be kept in {0}. Check that JobWarden may write to that folder.
