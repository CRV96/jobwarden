# A salary typed in for a job is written as postings write it, e.g. 60,000–80,000 EUR gross per year: these are the
# words for the tax and the period. SalaryParser must read them (DefaultSalaryServiceTests checks), so the salaries page can
# compare the salary like the others.
salaryText.period.HOUR=per hour
salaryText.period.DAY=per day
salaryText.period.WEEK=per week
salaryText.period.MONTH=per month
salaryText.period.YEAR=per year
salaryText.basis.GROSS=gross
salaryText.basis.NET=net
