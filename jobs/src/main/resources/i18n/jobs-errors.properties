# Messages users see for the jobs module's errors, in English. Also the fallback for languages the app doesn't have.
# Translations are in the files with a language suffix; MessageBundlesTests checks they all have the same keys.
# {0}, {1}... are the exception's arguments. Write apostrophes as ’: next to placeholders, ' is a quote character.

error.JOBS-001=Application {0} doesn’t exist.
error.JOBS-002=A rejection reason can only be given when the status is Rejected.
error.JOBS-003=Only an application that’s still at Applied, with nothing else on its timeline, can go back to Saved.
error.JOBS-004=Timeline event {0} doesn’t exist.
error.JOBS-005=An application’s timeline keeps at least one event: the one its status comes from.
error.JOBS-006=An interview’s format, place and duration can only be given when the status is Interviewing.
error.JOBS-007=The file has no title column. Its first row must name the columns, e.g. title, company, status.
