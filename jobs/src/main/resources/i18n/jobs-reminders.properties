# What the reminders set on the calendar say when they come, in English: the notifications the pages and the browser
# extension show. Also the fallback for languages the app doesn't have. Translations are in the files with a language
# suffix; MessageBundlesTests checks they all have the same keys. Write apostrophes as ’: next to placeholders, ' is a
# quote character.

# What the reminder is of: an interview, another event of the timeline, a deadline, a day to follow up
notice.interview=Interview
notice.event=Status change
notice.DEADLINE=Applications close
notice.FOLLOW_UP=Follow up
# The title: what, and when, e.g. Technical interview · in 15 min
notice.title={0} · {1}
notice.when.now=now
notice.when.minutes=in {0} min
notice.when.today=today
notice.when.todayAt=today at {0}
notice.when.tomorrow=tomorrow
notice.when.tomorrowAt=tomorrow at {0}
notice.when.on=on {0}
notice.when.onAt=on {0} at {1}
# The body: the job, then how the interview takes place, and where
notice.job={0} at {1}
notice.format.PHONE=Phone call
notice.format.VIDEO=Video call
notice.format.ON_SITE=On site
notice.format.TAKE_HOME=Take-home task
