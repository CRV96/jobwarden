error.JOBS-001=आवेदन {0} मौजूद नहीं है।
error.JOBS-002=अस्वीकृति का कारण सिर्फ़ तभी दिया जा सकता है जब स्थिति अस्वीकृत हो।
error.JOBS-003=सिर्फ़ वही आवेदन वापस “सहेजी गई” पर जा सकता है जो अब भी “आवेदन किया” पर है और जिसकी टाइमलाइन में और कुछ नहीं।
error.JOBS-004=टाइमलाइन घटना {0} मौजूद नहीं है।
error.JOBS-005=आवेदन की टाइमलाइन में कम से कम एक घटना रहती है: वही जिससे उसकी स्थिति आती है।
error.JOBS-006=इंटरव्यू का तरीक़ा, जगह और अवधि सिर्फ़ तभी दी जा सकती है जब स्थिति “इंटरव्यू जारी” हो।
error.JOBS-007=फ़ाइल में title कॉलम नहीं है। इसकी पहली पंक्ति में कॉलम के नाम होने चाहिए, जैसे title, company, status।
error.JOBS-008=उस नौकरी के कैलेंडर में उस दिन अब कुछ नहीं है: शायद यह किसी दूसरे टैब में बदल गई।
error.JOBS-009=मिनट या घंटे पहले वाला रिमाइंडर सिर्फ़ उसी प्रविष्टि पर लगता है जिसमें दिन का समय हो।
error.JOBS-010=नौकरी का यह स्टेटस पहले से है: कोई दूसरा क़दम, या उसकी टाइमलाइन में नोट जोड़ें।
