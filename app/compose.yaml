name: jobwarden

services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=jobwarden'
      - 'POSTGRES_USER=jobwarden'
      - 'POSTGRES_PASSWORD=jobwarden'
    ports:
      - '5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'

volumes:
  postgres-data:
