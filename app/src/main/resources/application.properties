spring.application.name=jobwarden

# The version, from the build (Maven fills it in): the pages, the MCP server and the browser extension show it.
jobwarden.version=@project.version@

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The texts users see, in English plus the translations next to them: the web pages, and each module's error messages.
# A language the app doesn't have falls back to English, not to the language of the machine the server runs on.
spring.messages.basename=i18n/web,i18n/common-errors,i18n/identity-errors,i18n/jobs-errors,i18n/jobs-reminders,i18n/jobs-salaries,i18n/discover-errors,i18n/cv-errors,i18n/hiring-errors,i18n/apply-errors,i18n/inbox-errors,i18n/watchlist-errors
spring.messages.fallback-to-system-locale=false

# Where the browser extension posts the job postings it captures. Change it here and in the extension together.
jobwarden.capture.path=/api/captures

# Where Claude connects to JobWarden's MCP server, e.g. claude mcp add --transport http jobwarden http://localhost:8080/mcp
jobwarden.mcp.path=/mcp

# Where Claude downloads the CV to upload to an application form, e.g. /claude/cv?profile=1&job=12. Like the MCP
# server, it trusts whoever can reach the server: keep JobWarden on your own machine or network.
jobwarden.claude.cv-path=/claude/cv

# How many requests wait for Claude, e.g. /claude/requests?profile=1: the loop the AI Assistant page gives asks it, and
# starts Claude Code only when there's one, so waiting costs no tokens. Like the MCP server, it trusts whoever can
# reach the server.
jobwarden.claude.requests-path=/claude/requests

# The selected profile lives in the HTTP session: keep it for a week instead of Tomcat's 30 minutes. The session
# cookie goes along with the app's own pages and links into it, but not with forms other sites submit to it.
server.servlet.session.timeout=7d
server.servlet.session.cookie.same-site=lax

# CV files up to 5 MB (CvService.MAX_FILE_MEGABYTES): the CV page says so for a file up to 6 MB, and checks the size
# before sending one larger.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# The app logs what changes at INFO. Reads, rejected forms and captures are logged at DEBUG; to see them, uncomment:
#logging.level.com.jobwarden=DEBUG

# Market salaries, on the salaries page. The Stack Overflow Developer Survey's answers (ODbL 1.0, credited on the page),
# downloaded when the page's button asks for them; a file: address works too.
jobwarden.market.stack-overflow.url=https://media.githubusercontent.com/media/StackExchange/Survey/main/packages/archive/2025/results.csv
jobwarden.market.stack-overflow.year=2025

# Eurostat's mean gross earnings of professionals in information and communication (Structure of Earnings Survey 2022).
jobwarden.market.eurostat.url=https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/earn_ses22_49?isco08=OC2&nace_r2=J&sex=T&indic_se=ERN&unit=EUR&sizeclas=GE10&lang=EN

# Salaries from current job ads, from the Adzuna API: a free app_id and app_key from https://developer.adzuna.com,
# entered in Settings Salaries (kept in the database, in use at once), or here, e.g. in the ADZUNA_APP_ID and
# ADZUNA_APP_KEY environment variables. A key saved in Settings takes the place of these. Without a key the page leaves
# job ads out.
jobwarden.market.adzuna.app-id=${ADZUNA_APP_ID:}
jobwarden.market.adzuna.app-key=${ADZUNA_APP_KEY:}

# Whether a newer JobWarden is out: the app asks GitHub for the latest release of this repository as it starts and every
# six hours, and the sidebar, the settings and the browser extension say when there's one. false never asks.
jobwarden.updates.repository=CRV96/jobwarden
jobwarden.updates.check=true

# Recruiters' emails, read from each profile's mailbox over IMAP (the inbox page): each as often as its profile says in
# Settings, every ten minutes at first. tick is how often JobWarden looks for the mailboxes whose time has come; the
# first time, a little after the server starts.
jobwarden.inbox.tick=PT1M
jobwarden.inbox.first-check=PT2M

# The watchlist (the AI Assistant page): the job boards of the companies each profile watches, on Greenhouse, Lever and
# Ashby, read from their public feeds with no Claude tokens, every six hours. tick is how often JobWarden looks for the
# boards whose time has come; the first time, a few minutes after the server starts.
jobwarden.watchlist.every=PT6H
jobwarden.watchlist.tick=PT10M
jobwarden.watchlist.first-check=PT3M

# The mailboxes' passwords and the GitHub tokens are kept encrypted with one key: secret-key (32 bytes in Base64, e.g.
# from the JOBWARDEN_SECRET_KEY environment variable, or INBOX_SECRET_KEY as before) when set, else a key file JobWarden
# makes the first time. Losing the key means entering them again; in Docker, keep the file on a volume, or set the key.
jobwarden.secret-key=${JOBWARDEN_SECRET_KEY:${INBOX_SECRET_KEY:}}
jobwarden.key-file=${user.home}/.jobwarden/inbox.key
