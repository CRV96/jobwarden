spring.application.name=jobwarden

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The texts users see, in English plus the translations next to them: the web pages, and each module's error messages.
# A language the app doesn't have falls back to English, not to the language of the machine the server runs on.
spring.messages.basename=i18n/web,i18n/common-errors,i18n/identity-errors,i18n/jobs-errors,i18n/discover-errors
spring.messages.fallback-to-system-locale=false

# Where the browser extension posts the job postings it captures. Change it here and in the extension together.
jobwarden.capture.path=/api/captures

# Where Claude connects to JobWarden's MCP server, e.g. claude mcp add --transport http jobwarden http://localhost:8080/mcp
jobwarden.mcp.path=/mcp

# The selected profile lives in the HTTP session: keep it for a week instead of Tomcat's 30 minutes. The session
# cookie goes along with the app's own pages and links into it, but not with forms other sites submit to it.
server.servlet.session.timeout=7d
server.servlet.session.cookie.same-site=lax

# The app logs what changes at INFO. Reads, rejected forms and captures are logged at DEBUG; to see them, uncomment:
#logging.level.com.jobwarden=DEBUG
