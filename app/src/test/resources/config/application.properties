# Added to the app's own application.properties for the tests (Spring Boot reads config/ after the classpath's root).
# The tests never ask GitHub for releases.
jobwarden.updates.check=false
# The tests encrypt the mailboxes' passwords with a key of their own, and never read a mailbox on a schedule.
jobwarden.secret-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
jobwarden.inbox.first-check=PT24H
