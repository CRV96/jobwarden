# Messages users see for the identity module's errors, in English. Also the fallback for languages the app doesn't have.
# Translations are in the files with a language suffix; MessageBundlesTests checks they all have the same keys.
# {0}, {1}... are the exception's arguments. Write apostrophes as ’: next to placeholders, ' is a quote character.

error.IDENTITY-001=Profile {0} doesn’t exist.
error.IDENTITY-002=A profile named {0} already exists.
error.IDENTITY-003=That file isn’t a photo JobWarden can read: use a PNG, JPEG or GIF.
error.IDENTITY-004=That photo is too large: at most {0} MB, and 4096 pixels a side.
