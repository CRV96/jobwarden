# Messages users see for the watchlist module's errors, in English. Also the fallback for languages the app doesn't have.
# Translations are in the files with a language suffix; MessageBundlesTests checks they all have the same keys.
# {0}, {1}... are the exception's arguments. Write apostrophes as ’: next to placeholders, ' is a quote character.

error.WATCHLIST-001=Company {0} isn’t on your watchlist.
error.WATCHLIST-002=JobWarden can’t watch that link: paste a link to a job, or to the careers page, on Greenhouse, Lever or Ashby, e.g. https://jobs.lever.co/acme.
error.WATCHLIST-003=There’s no job board at {0}: check the link.
error.WATCHLIST-004=The job board at {0} couldn’t be read: {1}
