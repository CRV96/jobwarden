# Messages users see for the inbox module's errors, in English. Also the fallback for languages the app doesn't have.
# Translations are in the files with a language suffix; MessageBundlesTests checks they all have the same keys.
# {0}, {1}... are the exception's arguments. Write apostrophes as ’: next to placeholders, ' is a quote character.

error.INBOX-001=That email update doesn’t exist any more: it may have been applied or dismissed in another tab.
error.INBOX-002=Couldn’t read the mailbox: {0}
error.INBOX-003=Connect a mailbox first.
error.INBOX-004=Nothing answers at {0}, port {1}. If it’s Proton Mail Bridge, open it, and check the IMAP port it shows.
