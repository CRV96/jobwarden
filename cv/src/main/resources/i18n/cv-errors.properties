# Messages users see for the cv module's errors, in English. Also the fallback for languages the app doesn't have.
# Translations are in the files with a language suffix; MessageBundlesTests checks they all have the same keys.
# {0}, {1}... are the exception's arguments. Write apostrophes as ’: next to placeholders, ' is a quote character.

error.CV-001=There’s no CV file to download.
error.CV-002=A CV can be a PDF, a Word document (.docx) or a text file, not {0}.
error.CV-003=The file is larger than {0} MB.
error.CV-004=The file is empty.
error.CV-005=The file isn’t a real {0} file: it may be damaged, or renamed from another kind.
