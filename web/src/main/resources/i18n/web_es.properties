howto.jobs.tip=Ajustes → Tus empleos exporta todas las ofertas como CSV, importa las de otra herramienta y archiva las antiguas de una vez.
howto.job.intro=Todo sobre una oferta: su anuncio, su historial y lo que Claude prepara para ella.
howto.job.1=Hazla avanzar con los botones de estado, o añade a su historial un paso con fecha: una entrevista con su hora, formato y lugar, un rechazo con su motivo.
howto.job.2=Un estado se dice una vez: Puesto cerrado no puede seguir a Puesto cerrado. Si el puesto vuelve a abrirse, márcalo Puesto reabierto; luego podrá cerrarse otra vez. Las entrevistas y las ofertas pueden repetirse, en cada ronda.
howto.job.3=Pide a Claude lo que la oferta necesita, cada tarjeta por su lado: el encaje, un CV a prueba de IA, una carta de presentación, mensajes a quienes contratan, la preparación de la entrevista y, en Oferta, cómo negociar. Cada una te da un prompt para pegar en Claude Code.
howto.job.4=Guarda con quién hablar y cuándo hacer seguimiento; pon recordatorios en entrevistas y plazos.
howto.job.5=Los lápices corrigen la ubicación y el salario; la dirección del anuncio lo abre.
howto.job.6=Archiva la oferta cuando termines con ella: sigue en tus estadísticas y vuelve con Recuperar.
howto.job.tip=Pliega una tarjeta hasta su título con su flecha: esa tarjeta queda plegada en todas las ofertas.
howto.newJob.intro=Añade una oferta que encontraste sin la extensión del navegador, por ejemplo por una recomendación o un reclutador.
howto.newJob.1=Dale un título; lo demás es opcional: la empresa, la ubicación, el salario, el enlace del anuncio y su descripción.
howto.newJob.2=Elige en qué punto está, Guardada, Enviada o más allá, y desde cuándo.
howto.newJob.3=Guárdala: se abre en su propia página, donde Claude puede puntuarla y adaptar tu CV.
howto.newJob.tip=Con la extensión del navegador, guardar un anuncio es un clic, con su descripción y su logo.
howto.pipeline.intro=Tus ofertas como tablero, una columna por estado.
howto.pipeline.1=Arrastra una tarjeta a otra columna para dar ese estado a la oferta, como los botones del panel lateral.
howto.pipeline.2=Haz clic en una tarjeta para abrir su oferta en el panel lateral.
howto.pipeline.3=Escribe en la búsqueda para limitar cada columna a las ofertas cuyo título o empresa tiene las palabras.
howto.pipeline.4=Una columna carga más tarjetas al llegar a su final; el número de arriba las cuenta todas.
howto.pipeline.tip=Las ofertas archivadas no están en el tablero: búscalas en Ofertas, en Archivadas.
howto.calendar.intro=Tus entrevistas, cambios de estado, plazos y días de seguimiento, por mes, semana o día.
howto.calendar.1=Cambia entre mes, semana y día, y muévete con las flechas o Hoy.
howto.calendar.2=La leyenda elige qué muestra el calendario: entrevistas, otros cambios de estado, plazos, seguimientos.
howto.calendar.3=Haz clic en una entrada para abrir su oferta en el panel lateral. Próximamente lista los próximos 30 días.
howto.calendar.4=El despertador junto a una entrada de Próximamente pone un recordatorio: a su hora, o antes.
howto.calendar.5=Suscribirse añade el calendario a Apple Calendar, Outlook o Google Calendar. Elige qué muestra, por ejemplo solo entrevistas y seguimientos: cada elección tiene su propia dirección, así que puedes suscribirte a varias.
howto.calendar.tip=Quien tenga la dirección de un calendario puede leerlo: Nueva dirección anula las antiguas.
howto.inbox.intro=Los correos de los reclutadores, leídos de tu buzón, como novedades de tus ofertas.
howto.inbox.1=Conecta tu buzón una vez, por IMAP con una contraseña de aplicación. JobWarden solo lo lee.
howto.inbox.2=Reconoce por las palabras del correo un rechazo, una entrevista, una oferta o una confirmación, y encuentra la oferta por su empresa y su título.
howto.inbox.3=Aplica una novedad para ponerla en el historial de la oferta, elige la oferta si no encontró ninguna, o descártala. Lo que el historial ya dice no añade nada.
howto.inbox.4=En Ajustes → Bandeja, elige cada cuánto lee, y si JobWarden, o Claude, ordena las novedades por su cuenta.
howto.inbox.tip=Nada cambia una oferta sin ti, salvo que los Ajustes lo digan.
howto.discover.intro=Donde Claude trabaja para ti, a través del servidor MCP de JobWarden, con tu propia suscripción a Claude.
howto.discover.1=Elige qué debe hacer Claude: buscar ofertas para tu CV o tus requisitos, ejecutar tus búsquedas guardadas, comprobar qué anuncios cerraron, puntuar tus ofertas u ordenar las que no tienen respuesta.
howto.discover.2=Pega el prompt en Claude Code, o ejecuta el comando en una terminal. El bucle que da la página hace cada petición por su cuenta, cada pocos minutos.
howto.discover.3=Las ofertas que Claude encuentra esperan aquí como tarjetas, cada una con por qué encaja: guárdala, postúlate o descártala, con los botones o el teclado.
howto.discover.4=Cada petición muestra cómo fue y qué hizo Claude.
howto.discover.tip=JobWarden no llama a ninguna IA y no necesita clave de API; lo que no necesita IA, lo hace al momento, gratis.
howto.search.intro=El Creador de búsquedas convierte lo que buscas en Warden Queries: búsquedas listas para los sitios donde se publican ofertas, una por plataforma.
howto.search.1=Describe el puesto en una frase, por ejemplo ingeniero backend senior, remoto Europa, contrato, y pulsa Rellenar los filtros; o rellénalos tú.
howto.search.2=Qué: los títulos, las habilidades y las palabras que excluir. Dónde: las ubicaciones y regiones, y remoto, híbrido o presencial. Qué empleos: el tipo de contrato y cuán recientes.
howto.search.3=Dónde busca Google: las páginas de empleo de las empresas, en Lever, Greenhouse, Ashby y similares, donde las ofertas suelen aparecer primero. Añade un dominio propio si quieres.
howto.search.4=A la derecha, una Warden Query por plataforma: Google, LinkedIn, Reddit, X y los portales de empleo remoto. Sus operadores, campos y frases van en color.
howto.search.5=Copia una consulta, o pulsa Abrir búsqueda para lanzarla en una pestaña nueva.
howto.search.6=Guardar búsqueda guarda los filtros con un nombre. Filtros guardados los vuelve a abrir; la Lista de seguimiento compara con ellos las ofertas nuevas de las empresas; Claude los ejecuta desde el Asistente IA.
howto.search.tip=La dirección guarda los filtros: añádela a marcadores para volver a una búsqueda, o compártela.
howto.hiring.intro=Publicaciones de reclutadores y responsables de contratación que dicen que contratan, y las personas detrás.
howto.hiring.1=Pide a Claude publicaciones sobre los puestos y lugares que indiques: busca en LinkedIn, X y Reddit. JobWarden no inicia sesión en ningún sitio.
howto.hiring.2=Descubrir muestra todas las publicaciones, las más recientes primero, filtradas por fecha, país, hashtag o palabras; Siguiendo, solo las personas que sigues.
howto.hiring.3=Sigue a un reclutador desde cualquiera de sus publicaciones, guarda una publicación como oferta u ocúltala para siempre.
howto.hiring.4=Reclutadores lista a todos, con su empresa y cómo llegaron. Pide a Claude reclutadores para tus puestos, o añade uno a mano.
howto.hiring.tip=Los contactos que guardas en tus ofertas aparecen aquí, seguidos; y la tarjeta Contactar de una oferta les escribe.
howto.cv.intro=Tu CV: lo que Claude lee para encontrar ofertas, y la base de todo lo que escribe para ti.
howto.cv.1=Sube tu CV, en PDF, Word o texto, o rellena los campos y JobWarden crea uno: previsualízalo y descárgalo en PDF.
howto.cv.2=Guarda tus historias para entrevistas en el banco de historias, con el método STAR, o pide a Claude que las esboce desde tu CV; completa las marcadas Por completar.
howto.cv.3=Conecta GitHub, marca los repositorios que vale la pena mostrar y pide a Claude que escriba tus proyectos a partir de ellos.
howto.cv.4=Los CV que Claude adaptó a ofertas aparecen aquí, cada uno con su PDF.
howto.cv.tip=Claude nunca añade una habilidad, un puesto o una cifra que tu CV no tenga.
howto.apply.intro=Claude se postula por ti a tus ofertas guardadas, en tu propio Chrome, con tus propias sesiones.
howto.apply.1=Rellena tus respuestas una vez: dónde puedes trabajar, visado, preaviso, expectativa salarial, cartas de presentación y tus propias preguntas.
howto.apply.2=Marca las ofertas, elige si Claude envía cada formulario o lo rellena para que lo revises, y pega el prompt en Claude Code con Claude en Chrome (claude --chrome).
howto.apply.3=En cada oferta, Claude adapta tu CV, lo sube con la carta de presentación de la oferta y responde solo con tus respuestas: una pregunta que no cubren detiene la oferta y te espera aquí.
howto.apply.4=Cada oferta muestra cómo fue; una a la que Claude se postuló pasa a Enviada.
howto.apply.tip=Claude se salta LinkedIn Easy Apply y los sitios que prohíben postularse de forma automática, y se detiene en un CAPTCHA para que lo resuelvas.
howto.offers.intro=Tus ofertas una al lado de otra, frente a lo que paga el mercado.
howto.offers.1=Cuando una oferta llega a Oferta, escribe sus condiciones en su página: salario base, bonus, acciones, vacaciones, fecha de inicio y cuándo responder.
howto.offers.2=Elige la moneda y el periodo, y el puesto y el lenguaje con los que comparar el mercado.
howto.offers.3=Cada columna muestra el salario en una moneda, cuánto se aleja del mercado de su país, el encaje y los días que quedan para responder; la mejor pagada va marcada.
howto.offers.4=Haz clic en una oferta para abrirla y pregunta a Claude cómo negociarla: qué pedir, lo mínimo que aceptar, qué decir y un correo.
howto.offers.tip=Las cifras del mercado vienen de la página Salarios: carga allí la encuesta de Stack Overflow para tener más países.
howto.salaries.intro=Lo que pagan tus ofertas, comparado en una moneda, y lo que paga el mercado.
howto.salaries.1=Elige la moneda y el periodo: cada salario se convierte al cambio del Banco Central Europeo.
howto.salaries.2=Las cifras dan la mediana, la mitad central y el más alto; el gráfico, el rango de cada oferta.
howto.salaries.3=Un salario que JobWarden no sabe leer aparece abajo para corregirlo; o corrígelo con el lápiz en la página de la oferta.
howto.salaries.4=Los salarios de mercado comparan un puesto y un lenguaje entre países, con la encuesta de Stack Overflow, los anuncios de Adzuna y Eurostat.
howto.salaries.tip=Adzuna necesita una clave gratuita: añádela en Ajustes → Salarios.
howto.statistics.intro=Cómo te fue con tus candidaturas, contado a partir de los historiales de las ofertas, sin IA.
howto.statistics.1=A cuántas te postulaste, cuántas veces hubo respuesta, entrevista u oferta, y cuánto tardaron las respuestas.
howto.statistics.2=Qué sitios, y quién se postuló (tú, Claude o la extensión), tuvieron más respuestas.
howto.statistics.3=Si las ofertas que Claude puntuó alto llevaron a entrevistas más a menudo: cuánto fiarte de las puntuaciones.
howto.statistics.4=Los requisitos que más te faltaron y por qué te rechazaron: en qué trabajar.
howto.statistics.tip=Las ofertas archivadas siguen contando aquí.
howto.settings.intro=Cómo se ve y habla JobWarden, la extensión del navegador, Claude y tus datos.
howto.settings.1=La foto de tu perfil, el tema y el idioma.
howto.settings.2=Tus empleos: expórtalos como CSV, importa los de otra herramienta o archiva los antiguos de una vez.
howto.settings.3=Bandeja: cada cuánto se lee tu buzón y qué pasa con las novedades que se encuentran.
howto.settings.4=Extensión del navegador y Claude: la dirección del servidor, el id de tu perfil y el comando que conecta Claude Code con JobWarden.
howto.settings.5=Salarios: la clave de Adzuna para los salarios de los anuncios.
howto.settings.tip=Cada perfil tiene sus propias ofertas, su CV y sus ajustes.
howto.profiles.intro=Los perfiles separan búsquedas de empleo: la tuya y la de un amigo, o empleo fijo y freelance.
howto.profiles.1=Elige un perfil para abrirlo; el menú al pie de la barra lateral cambia entre ellos.
howto.profiles.2=Crea uno con un nombre: empieza sin ofertas, sin CV y con sus propios ajustes.
howto.profiles.tip=La extensión del navegador y Claude necesitan el id del perfil, que aparece bajo su nombre.
