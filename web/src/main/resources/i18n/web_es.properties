search.faq.boolean.question=¿Qué es una búsqueda booleana?
search.faq.boolean.answer=Una búsqueda que combina palabras clave con operadores: OR entre alternativas, un espacio o AND entre palabras que deben aparecer todas, un signo menos o NOT delante de las palabras a excluir y comillas alrededor de una frase exacta. Reduce miles de resultados a los empleos que encajan.
search.faq.ats.question=¿Por qué buscar directamente en los sistemas de seguimiento de candidatos?
search.faq.ats.answer=Las empresas publican sus ofertas en sistemas como Lever, Greenhouse y Ashby, a menudo antes que en los portales de empleo, o en su lugar. Buscar en esos sitios con Google encuentra los empleos directamente en la fuente, con menos duplicados y agencias.
search.faq.limit.question=¿Por qué la búsqueda de Google se detiene en 32 palabras?
search.faq.limit.answer=Google ignora todo lo que va después de las primeras 32 palabras de una búsqueda. El generador deja fuera los términos que no caben, empezando por los últimos, y lo indica. Las demás plataformas reciben todos los términos.
search.faq.remote.question=¿Cómo encuentro empleos remotos en Europa?
search.faq.remote.answer=Añade Europe, EMEA o remote EU como ubicación y elige Remoto como modalidad. La pestaña Portales de empleo remoto busca en sitios que solo publican empleos remotos.
