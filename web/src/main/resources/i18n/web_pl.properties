search.faq=Pytania
search.faq.query.question=Czym jest Warden Query?
search.faq.query.answer=Tak JobWarden nazywa wyszukiwania, które buduje, to, co rekruterzy nazywają wyszukiwaniem boolowskim: słowa kluczowe połączone operatorami. OR między wariantami, spacja albo AND między słowami, które muszą wystąpić wszystkie, minus albo NOT przed słowami do pominięcia, cudzysłów wokół dokładnej frazy. Każda platforma dostaje je we własnej składni, a ono zawęża tysiące wyników do pasujących ofert.
search.faq.ats.question=Dlaczego szukać bezpośrednio w systemach rekrutacyjnych?
search.faq.ats.answer=Firmy publikują oferty w systemach takich jak Lever, Greenhouse i Ashby, często zanim trafią na portale z ogłoszeniami albo zamiast tego. Wyszukiwanie tych stron w Google znajduje oferty u źródła, z mniejszą liczbą duplikatów i agencji.
search.faq.limit.question=Dlaczego zapytanie Google kończy się na 32 słowach?
search.faq.limit.answer=Google pomija wszystko po pierwszych 32 słowach wyszukiwania. Generator pomija słowa, które się nie mieszczą, zaczynając od ostatnich, i informuje o tym. Pozostałe platformy dostają wszystkie słowa.
search.faq.remote.question=Jak znaleźć pracę zdalną w Europie?
search.faq.remote.answer=Dodaj Europe, EMEA lub remote EU jako lokalizację i wybierz Zdalnie jako tryb pracy. Zakładka Portale z pracą zdalną przeszukuje strony z wyłącznie zdalnymi ofertami.
