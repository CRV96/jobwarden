# How each page works, which its header’s button opens
help.button=Jak to działa
help.done=Rozumiem
howto.jobs.intro=Wszystkie oferty, które śledzisz: zapisane rozszerzeniem przeglądarki, znalezione przez Claude albo dodane ręcznie.
howto.jobs.1=Zapisuj ogłoszenia rozszerzeniem przeglądarki (Zapisz albo Aplikowałem), albo dodaj jedno przyciskiem Dodaj ofertę.
howto.jobs.2=Szukaj po tytule lub firmie, filtruj po statusie i sortuj po dowolnej kolumnie. Adres zapamiętuje twoje wybory, więc możesz dodać go do zakładek.
howto.jobs.3=Kliknij wiersz, aby otworzyć ofertę w panelu bocznym, albo jej tytuł, aby przejść na jej stronę. Nazwa serwisu otwiera ogłoszenie.
howto.jobs.4=Zaznacz wiersze, aby zarchiwizować lub usunąć kilka naraz. Zarchiwizowane oferty znikają z listy, rekrutacji i kalendarza; filtr Archiwum je pokazuje, aby je przywrócić.
howto.jobs.5=Dopasowanie mówi, jak bardzo twoje CV pasuje do oferty, gdy Claude ją ocenił: od 4 w górę to dobre dopasowanie.
howto.jobs.tip=Ustawienia → Twoje oferty eksportuje wszystkie oferty do CSV, importuje te z innego narzędzia i archiwizuje stare naraz.
howto.job.intro=Wszystko o jednej ofercie: jej ogłoszenie, historia i to, co Claude dla niej przygotowuje.
howto.job.1=Posuwaj ją dalej przyciskami statusu albo dodaj do historii krok z datą: rozmowę z godziną, formą i miejscem, odmowę z powodem.
howto.job.2=Status mówi się raz: Oferta zamknięta nie może nastąpić po Oferta zamknięta. Gdy stanowisko znów się otworzy, oznacz je jako Oferta ponownie otwarta; potem może się znów zamknąć. Rozmowy i oferty mogą się powtarzać, w każdej rundzie.
howto.job.3=Poproś Claude o to, czego oferta potrzebuje, każda karta osobno: dopasowanie, CV odporne na AI, list motywacyjny, wiadomości do osób rekrutujących, przygotowanie do rozmowy, a przy ofercie: jak negocjować. Każda daje prompt do wklejenia w Claude Code.
howto.job.4=Zapisz, z kim rozmawiać i kiedy się przypomnieć; ustaw przypomnienia o rozmowach i terminach.
howto.job.5=Ołówki poprawiają lokalizację i wynagrodzenie; adres ogłoszenia je otwiera.
howto.job.6=Zarchiwizuj ofertę, gdy z nią skończysz: zostaje w twoich statystykach i wraca przyciskiem Przywróć.
howto.job.tip=Zwiń kartę do tytułu jej strzałką: ta karta zostaje zwinięta w każdej ofercie.
howto.newJob.intro=Dodaj ofertę znalezioną bez rozszerzenia przeglądarki, na przykład z polecenia albo od rekrutera.
howto.newJob.1=Nadaj jej tytuł; reszta jest opcjonalna: firma, lokalizacja, wynagrodzenie, link do ogłoszenia i jego opis.
howto.newJob.2=Wybierz, na jakim jest etapie, Zapisana, Wysłana albo dalej, i od kiedy.
howto.newJob.3=Zapisz ją: otworzy się na własnej stronie, gdzie Claude może ją ocenić i dopasować twoje CV.
howto.newJob.tip=Z rozszerzeniem przeglądarki zapisanie ogłoszenia to jedno kliknięcie, z opisem i logo.
howto.pipeline.intro=Twoje oferty jako tablica, po jednej kolumnie na status.
howto.pipeline.1=Przeciągnij kartę do innej kolumny, aby nadać ofercie ten status, jak przyciski w panelu bocznym.
howto.pipeline.2=Kliknij kartę, aby otworzyć ofertę w panelu bocznym.
howto.pipeline.3=Wpisz w wyszukiwarkę, aby zawęzić każdą kolumnę do ofert, których tytuł lub firma zawiera te słowa.
howto.pipeline.4=Kolumna dołącza kolejne karty, gdy przewiniesz do jej końca; liczba nad nią liczy wszystkie.
howto.pipeline.tip=Zarchiwizowanych ofert nie ma na tablicy: znajdziesz je w Ofertach, w Archiwum.
howto.calendar.intro=Twoje rozmowy, zmiany statusu, terminy i dni na przypomnienie, w widoku miesiąca, tygodnia lub dnia.
howto.calendar.1=Przełączaj miesiąc, tydzień i dzień, a przesuwaj się strzałkami lub przyciskiem Dziś.
howto.calendar.2=Legenda wybiera, co pokazuje kalendarz: rozmowy, inne zmiany statusu, terminy, przypomnienia.
howto.calendar.3=Kliknij wpis, aby otworzyć jego ofertę w panelu bocznym. Wkrótce pokazuje najbliższe 30 dni.
howto.calendar.4=Budzik przy wpisie w sekcji Wkrótce ustawia przypomnienie: o jego godzinie albo wcześniej.
howto.calendar.5=Subskrybuj dodaje kalendarz do Kalendarza Apple, Outlooka lub Kalendarza Google. Wybierz, co pokazuje, na przykład tylko rozmowy i przypomnienia: każdy wybór ma własny adres, więc możesz subskrybować kilka.
howto.calendar.tip=Każdy, kto ma adres kalendarza, może go czytać: Nowy adres unieważnia stare.
howto.inbox.intro=E-maile od rekruterów, czytane z twojej skrzynki, jako aktualizacje twoich ofert.
howto.inbox.1=Połącz skrzynkę raz, przez IMAP z hasłem aplikacji. JobWarden tylko ją czyta.
howto.inbox.2=Po słowach e-maila rozpoznaje odmowę, rozmowę, ofertę lub potwierdzenie, a ofertę znajduje po firmie i tytule.
howto.inbox.3=Zastosuj aktualizację, aby trafiła do historii oferty, wybierz ofertę, gdy żadnej nie znalazł, albo ją odrzuć. To, co historia już mówi, niczego nie dodaje.
howto.inbox.4=W Ustawienia → Skrzynka wybierz, jak często czyta, i czy JobWarden albo Claude sam porządkuje aktualizacje.
howto.inbox.tip=Nic nie zmienia oferty bez ciebie, chyba że tak mówią Ustawienia.
howto.discover.intro=Tu Claude pracuje dla ciebie, przez serwer MCP JobWarden, w ramach twojej subskrypcji Claude.
howto.discover.1=Wybierz, co ma zrobić Claude: znaleźć oferty dla twojego CV lub wymagań, uruchomić zapisane wyszukiwania, sprawdzić, które ogłoszenia zamknięto, ocenić twoje oferty albo uporządkować te bez odpowiedzi.
howto.discover.2=Wklej prompt w Claude Code albo uruchom polecenie w terminalu. Pętla, którą daje strona, wykonuje każde zlecenie sama, co kilka minut.
howto.discover.3=Oferty znalezione przez Claude czekają tu jako karty, każda z powodem: zapisz ją, aplikuj albo odrzuć, przyciskami lub klawiaturą.
howto.discover.4=Każde zlecenie pokazuje, jak poszło i co zrobił Claude.
howto.discover.tip=JobWarden sam nie wywołuje żadnej AI i nie potrzebuje klucza API; to, co nie wymaga AI, robi od razu, za darmo.
howto.search.intro=Kreator wyszukiwań zamienia to, czego szukasz, w Warden Queries: gotowe wyszukiwania dla miejsc, gdzie publikuje się oferty, po jednym na platformę.
howto.search.1=Opisz stanowisko jednym zdaniem, na przykład senior backend engineer, zdalnie Europa, kontrakt, i kliknij Wypełnij filtry; albo wypełnij je sam.
howto.search.2=Co: tytuły stanowisk, umiejętności i słowa do pominięcia. Gdzie: lokalizacje i regiony, oraz zdalnie, hybrydowo lub na miejscu. Jakie oferty: rodzaj umowy i jak świeże.
howto.search.3=Gdzie szuka Google: strony karier firm, na Lever, Greenhouse, Ashby i podobnych, gdzie oferty często pojawiają się najpierw. Dodaj własną domenę, jeśli chcesz.
howto.search.4=Po prawej Warden Query dla każdej platformy: Google, LinkedIn, Reddit, X i portale z pracą zdalną. Jej operatory, pola i frazy są kolorowe.
howto.search.5=Skopiuj zapytanie albo kliknij Otwórz wyszukiwanie, aby uruchomić je w nowej karcie.
howto.search.6=Zapisz wyszukiwanie zapamiętuje filtry pod nazwą. Zapisane filtry otwiera je ponownie; Lista obserwowanych porównuje z nimi nowe oferty firm; Claude uruchamia je z Asystenta AI.
howto.search.tip=Adres zapamiętuje filtry: dodaj go do zakładek, aby wrócić do wyszukiwania, albo go udostępnij.
howto.hiring.intro=Posty rekruterów i menedżerów, którzy piszą, że zatrudniają, oraz ludzie, którzy za nimi stoją.
howto.hiring.1=Poproś Claude o posty dla podanych stanowisk i miejsc: szuka na LinkedIn, X i Reddit. JobWarden nigdzie się nie loguje.
howto.hiring.2=Odkrywaj pokazuje wszystkie posty, najnowsze najpierw, filtrowane po czasie, kraju, hashtagu lub słowach; Obserwowani tylko osoby, które obserwujesz.
howto.hiring.3=Obserwuj rekrutera z dowolnego jego posta, zapisz post jako ofertę albo ukryj go na dobre.
howto.hiring.4=Rekruterzy pokazuje wszystkich, z firmą i tym, skąd się wzięli. Poproś Claude o rekruterów dla twoich stanowisk albo dodaj kogoś ręcznie.
howto.hiring.tip=Kontakty zapisane przy ofertach pojawiają się tu jako obserwowani, a karta Odezwij się w ofercie pisze do nich.
howto.cv.intro=Twoje CV: to, co czyta Claude, by znaleźć oferty, i podstawa wszystkiego, co dla ciebie pisze.
howto.cv.1=Wgraj CV, jako PDF, dokument Word lub tekst, albo wypełnij pola, a JobWarden je zbuduje: obejrzyj podgląd i pobierz PDF.
howto.cv.2=Trzymaj historie na rozmowy w banku historii, metodą STAR, albo poproś Claude o ich szkic na podstawie CV; uzupełnij te oznaczone Do uzupełnienia.
howto.cv.3=Połącz GitHub, zaznacz repozytoria warte pokazania i poproś Claude, aby opisał na ich podstawie twoje projekty.
howto.cv.4=CV dopasowane przez Claude do ofert są tu wymienione, każde ze swoim PDF.
howto.cv.tip=Claude nigdy nie dodaje umiejętności, stanowiska ani liczby, których nie ma w twoim CV.
howto.apply.intro=Claude aplikuje za ciebie na zapisane oferty, w twoim własnym Chrome, z twoimi zalogowanymi kontami.
howto.apply.1=Wypełnij odpowiedzi raz: gdzie możesz pracować, wiza, okres wypowiedzenia, oczekiwania płacowe, listy motywacyjne i twoje własne pytania.
howto.apply.2=Zaznacz oferty, wybierz, czy Claude wysyła każdy formularz, czy wypełnia go do sprawdzenia, i wklej prompt w Claude Code z Claude w Chrome (claude --chrome).
howto.apply.3=Dla każdej oferty Claude dopasowuje CV, wgrywa je z listem motywacyjnym oferty i odpowiada tylko twoimi odpowiedziami: pytanie, którego nie obejmują, zatrzymuje ofertę i czeka tu na ciebie.
howto.apply.4=Każda oferta pokazuje, jak poszło; ta, na którą Claude zaaplikował, przechodzi do Wysłana.
howto.apply.tip=Claude pomija LinkedIn Easy Apply i serwisy zabraniające automatycznego aplikowania, a przy CAPTCHA zatrzymuje się, abyś ją rozwiązał.
howto.offers.intro=Twoje oferty obok siebie, na tle tego, co płaci rynek.
howto.offers.1=Gdy oferta dojdzie do etapu Oferta, wpisz jej warunki na jej stronie: pensję podstawową, premię, udziały, urlop, datę startu i termin odpowiedzi.
howto.offers.2=Wybierz walutę i okres oraz stanowisko i język do porównania z rynkiem.
howto.offers.3=Każda kolumna pokazuje pensję w jednej walucie, jak daleko jest od rynku w jej kraju, dopasowanie i dni do odpowiedzi; najlepiej płatna jest oznaczona.
howto.offers.4=Kliknij ofertę, aby otworzyć jej stronę, i zapytaj Claude, jak ją negocjować: o co prosić, minimum do przyjęcia, co powiedzieć i e-mail.
howto.offers.tip=Liczby rynku pochodzą ze strony Wynagrodzenia: wczytaj tam ankietę Stack Overflow, aby mieć najwięcej krajów.
howto.letters.intro=List motywacyjny każdej oferty i jej wiadomości do osób, które rekrutują, w jednym miejscu.
howto.letters.1=Napisz raz list bazowy: twój styl i akapity, których zawsze używasz. Tam, gdzie ma być firma i stanowisko, wpisz {company} i {role}: każda oferta je uzupełnia.
howto.letters.2=Wybierz ofertę z listy: jej list i wiadomości otwierają się obok. Napisz list sam, zaczynając od listu bazowego, albo poproś Claude, aby napisał go na podstawie CV i ogłoszenia.
howto.letters.3=Aby mieć kilka naraz, zaznacz oferty bez listu i poproś Claude: wklej jeden prompt do Claude Code, a napisze je jeden po drugim.
howto.letters.4=Zmień dowolny list, obejrzyj podgląd, skopiuj go lub pobierz jako PDF z imieniem, nazwiskiem i danymi kontaktowymi.
howto.letters.5=Pod listem sekcja Odezwij się trzyma notatkę na LinkedIn i e-mail do osób rekrutujących na tę ofertę, do wysłania przez ciebie.
howto.letters.tip=JobWarden nigdy niczego nie wysyła: listy i wiadomości wysyłasz sam. Zakończone oferty pojawiają się tylko, gdy mają list.
howto.salaries.intro=Ile płacą twoje oferty, porównane w jednej walucie, i ile płaci rynek.
howto.salaries.1=Wybierz walutę i okres: każde wynagrodzenie jest przeliczane po kursach Europejskiego Banku Centralnego.
howto.salaries.2=Liczby podają medianę, środkową połowę i najwyższe; wykres, przedział każdej oferty.
howto.salaries.3=Wynagrodzenie, którego JobWarden nie umie odczytać, jest poniżej do poprawienia; albo popraw je ołówkiem na stronie oferty.
howto.salaries.4=Wynagrodzenia rynkowe porównują stanowisko i język między krajami, z ankiety Stack Overflow, ogłoszeń Adzuny i Eurostatu.
howto.salaries.tip=Adzuna wymaga darmowego klucza: dodaj go w Ustawienia → Wynagrodzenia.
howto.statistics.intro=Jak poszły twoje aplikacje, policzone z historii ofert, bez AI.
howto.statistics.1=Na ile ofert zaaplikowałeś, jak często przyszła odpowiedź, rozmowa lub oferta i jak długo trwały odpowiedzi.
howto.statistics.2=Które serwisy, i kto aplikował (ty, Claude czy rozszerzenie), dostały najwięcej odpowiedzi.
howto.statistics.3=Czy oferty wysoko ocenione przez Claude częściej kończyły się rozmową: na ile ufać ocenom.
howto.statistics.4=Wymagania, których najczęściej ci brakowało, i dlaczego cię odrzucano: nad czym pracować.
howto.statistics.tip=Zarchiwizowane oferty nadal się tu liczą.
howto.settings.intro=Wygląd i język JobWarden, rozszerzenie przeglądarki, Claude i twoje dane.
howto.settings.1=Zdjęcie profilu, motyw i język.
howto.settings.2=Twoje oferty: wyeksportuj je do CSV, zaimportuj te z innego narzędzia albo zarchiwizuj stare naraz.
howto.settings.3=Skrzynka: jak często czytana jest twoja skrzynka i co dzieje się ze znalezionymi aktualizacjami.
howto.settings.4=Rozszerzenie przeglądarki i Claude: adres serwera, id twojego profilu i polecenie, które łączy Claude Code z JobWarden.
howto.settings.5=Wynagrodzenia: klucz Adzuny do wynagrodzeń z ogłoszeń.
howto.settings.tip=Każdy profil ma własne oferty, CV i ustawienia.
howto.profiles.intro=Profile oddzielają poszukiwania pracy: twoje i przyjaciela, albo etat i freelancing.
howto.profiles.1=Wybierz profil, aby go otworzyć; menu na dole paska bocznego przełącza między nimi.
howto.profiles.2=Utwórz profil z nazwą: zaczyna bez ofert, bez CV i z własnymi ustawieniami.
howto.profiles.tip=Rozszerzenie przeglądarki i Claude potrzebują id profilu, widocznego pod jego nazwą.
