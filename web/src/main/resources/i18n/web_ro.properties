# How each page works, which its header’s button opens
help.button=Cum funcționează
help.done=Am înțeles
howto.jobs.intro=Toate joburile pe care le urmărești: salvate cu extensia de browser, găsite de Claude sau adăugate de mână.
howto.jobs.1=Salvează anunțuri cu extensia de browser (Salvează, sau Am aplicat), sau adaugă unul cu Adaugă job.
howto.jobs.2=Caută după titlu sau companie, filtrează după status și sortează după orice coloană. Adresa păstrează alegerile tale, așa că o poți pune la favorite.
howto.jobs.3=Dă clic pe un rând ca să deschizi jobul în panoul lateral, sau pe titlu pentru pagina lui. Numele site-ului deschide anunțul.
howto.jobs.4=Bifează rânduri ca să arhivezi sau să ștergi mai multe deodată. Joburile arhivate ies din listă, din progres și din calendar; filtrul Arhivate le arată, ca să le aduci înapoi.
howto.jobs.5=Potrivirea arată cât de bine se potrivește CV-ul tău cu jobul, după ce Claude l-a punctat: de la 4 în sus e o potrivire bună.
howto.jobs.tip=Setări → Joburile tale exportă toate joburile în CSV, le importă pe ale altui instrument și le arhivează pe cele vechi deodată.
howto.job.intro=Tot despre un job: anunțul, istoricul și ce pregătește Claude pentru el.
howto.job.1=Du-l mai departe cu butoanele de status, sau adaugă în istoric un pas cu dată: un interviu cu ora, formatul și locul, o respingere cu motivul ei.
howto.job.2=Un status se spune o dată: Post închis nu poate urma după Post închis. Dacă postul se redeschide, marchează-l Post redeschis; apoi se poate închide din nou. Interviurile și ofertele se pot repeta, la fiecare rundă.
howto.job.3=Cere-i lui Claude ce îi trebuie jobului, fiecare card pe rând: potrivirea, un CV pregătit pentru AI, o scrisoare de intenție, mesaje către cei care angajează, pregătirea pentru interviu și, la Ofertă, cum să negociezi. Fiecare îți dă un prompt de lipit în Claude Code.
howto.job.4=Ține minte cu cine vorbești și când revii; pune mementouri la interviuri și termene.
howto.job.5=Creioanele corectează locația și salariul; adresa anunțului îl deschide.
howto.job.6=Arhivează jobul când ai terminat cu el: rămâne în statisticile tale și revine cu Readu.
howto.job.tip=Strânge un card până la titlu cu săgeata lui: acel card rămâne strâns la toate joburile.
howto.newJob.intro=Adaugă un job găsit fără extensia de browser, de exemplu printr-o recomandare sau de la un recrutor.
howto.newJob.1=Dă-i un titlu; restul e opțional: compania, locația, salariul, linkul anunțului și descrierea.
howto.newJob.2=Alege unde se află, Salvată, Trimisă sau mai departe, și de când.
howto.newJob.3=Salvează-l: se deschide pe pagina lui, unde Claude îl poate puncta și îți poate adapta CV-ul.
howto.newJob.tip=Cu extensia de browser, salvezi un anunț dintr-un clic, cu descrierea și logoul lui.
howto.pipeline.intro=Joburile tale ca un panou, câte o coloană pentru fiecare status.
howto.pipeline.1=Trage un card în altă coloană ca să-i dai jobului acel status, ca butoanele din panoul lateral.
howto.pipeline.2=Dă clic pe un card ca să deschizi jobul în panoul lateral.
howto.pipeline.3=Scrie în căutare ca să limitezi fiecare coloană la joburile al căror titlu sau companie conține cuvintele.
howto.pipeline.4=O coloană încarcă mai multe carduri când ajungi la capătul ei; numărul de deasupra le numără pe toate.
howto.pipeline.tip=Joburile arhivate nu sunt pe panou: le găsești în Joburi, la Arhivate.
howto.calendar.intro=Interviurile, schimbările de status, termenele și zilele de revenit, pe lună, săptămână sau zi.
howto.calendar.1=Comută între lună, săptămână și zi, și mută-te cu săgețile sau Azi.
howto.calendar.2=Legenda alege ce arată calendarul: interviuri, alte schimbări de status, termene, reveniri.
howto.calendar.3=Dă clic pe o intrare ca să deschizi jobul ei în panoul lateral. Urmează listează următoarele 30 de zile.
howto.calendar.4=Ceasul de lângă o intrare din Urmează pune un memento: la ora ei, sau înainte.
howto.calendar.5=Abonează-te adaugă calendarul în Apple Calendar, Outlook sau Google Calendar. Alege ce arată, de exemplu doar interviurile și revenirile: fiecare alegere are adresa ei, așa că te poți abona la mai multe.
howto.calendar.tip=Oricine are adresa unui calendar îl poate citi: Adresă nouă le oprește pe cele vechi.
howto.inbox.intro=E-mailurile recrutorilor, citite din căsuța ta, ca noutăți despre joburile tale.
howto.inbox.1=Conectează-ți căsuța o dată, prin IMAP cu o parolă de aplicație. JobWarden doar o citește.
howto.inbox.2=Recunoaște după cuvintele e-mailului o respingere, un interviu, o ofertă sau o confirmare, și găsește jobul după companie și titlu.
howto.inbox.3=Aplică o noutate ca s-o pui în istoricul jobului, alege jobul dacă n-a găsit niciunul, sau renunță la ea. Ce spune deja istoricul nu adaugă nimic.
howto.inbox.4=În Setări → Inbox, alege cât de des citește și dacă JobWarden, sau Claude, sortează singur noutățile.
howto.inbox.tip=Nimic nu schimbă un job fără tine, decât dacă Setările spun asta.
howto.discover.intro=Locul unde Claude lucrează pentru tine, prin serverul MCP al JobWarden, cu propriul tău abonament Claude.
howto.discover.1=Alege ce să facă Claude: să găsească joburi pentru CV-ul sau cerințele tale, să ruleze căutările salvate, să verifice ce anunțuri s-au închis, să-ți puncteze joburile sau să le ordoneze pe cele fără răspuns.
howto.discover.2=Lipește promptul în Claude Code, sau rulează comanda într-un terminal. Bucla pe care o dă pagina face singură fiecare cerere, la câteva minute.
howto.discover.3=Joburile găsite de Claude așteaptă aici sub formă de carduri, fiecare cu motivul: salvează-l, aplică sau renunță la el, cu butoanele sau tastatura.
howto.discover.4=Fiecare cerere arată cum a mers și ce a făcut Claude.
howto.discover.tip=JobWarden nu apelează nicio IA și nu are nevoie de cheie API; ce nu cere IA face imediat, gratis.
howto.search.intro=Constructorul de căutări transformă ce vrei în Warden Queries: căutări gata făcute pentru locurile unde apar joburi, câte una pentru fiecare platformă.
howto.search.1=Descrie jobul într-o propoziție, de exemplu inginer backend senior, remote Europa, contract, și apasă Completează filtrele; sau completează-le tu.
howto.search.2=Ce: titlurile, abilitățile și cuvintele de exclus. Unde: locațiile și regiunile, și remote, hibrid sau la birou. Ce joburi: tipul de contract și cât de recente.
howto.search.3=Unde caută Google: paginile de cariere ale companiilor, pe Lever, Greenhouse, Ashby și altele, unde joburile apar adesea primele. Adaugă un domeniu al tău dacă vrei.
howto.search.4=În dreapta, câte o Warden Query pentru fiecare platformă: Google, LinkedIn, Reddit, X și site-urile de joburi remote. Operatorii, câmpurile și expresiile ei sunt colorate.
howto.search.5=Copiază o căutare, sau apasă Deschide căutarea ca s-o rulezi într-o filă nouă.
howto.search.6=Salvează căutarea păstrează filtrele sub un nume. Filtre salvate le redeschide; Lista de urmărire compară cu ele joburile noi ale companiilor; Claude le rulează din Asistentul AI.
howto.search.tip=Adresa păstrează filtrele: pune-o la favorite ca să revii la o căutare, sau trimite-o cuiva.
howto.hiring.intro=Postările recrutorilor și ale managerilor care spun că angajează, și oamenii din spatele lor.
howto.hiring.1=Cere-i lui Claude postări despre rolurile și locurile pe care le dai: caută pe LinkedIn, X și Reddit. JobWarden nu se conectează nicăieri.
howto.hiring.2=Descoperă arată toate postările, cele mai noi primele, filtrate după timp, țară, hashtag sau cuvinte; Urmărite, doar oamenii pe care îi urmărești.
howto.hiring.3=Urmărește un recrutor din oricare dintre postările lui, salvează o postare ca job sau ascunde-o definitiv.
howto.hiring.4=Recrutori îi listează pe toți, cu compania lor și de unde au venit. Cere-i lui Claude recrutori pentru rolurile tale, sau adaugă unul de mână.
howto.hiring.tip=Contactele salvate la joburile tale apar aici, urmărite; iar cardul Ia legătura al unui job le scrie.
howto.cv.intro=CV-ul tău: ce citește Claude ca să găsească joburi, și baza a tot ce scrie pentru tine.
howto.cv.1=Încarcă-ți CV-ul, ca PDF, Word sau text, sau completează câmpurile și JobWarden construiește unul: previzualizează-l și descarcă-l ca PDF.
howto.cv.2=Păstrează-ți poveștile pentru interviuri în banca de povești, după metoda STAR, sau cere-i lui Claude să le schițeze din CV; completează-le pe cele marcate De completat.
howto.cv.3=Conectează GitHub, bifează repository-urile care merită arătate și cere-i lui Claude să-ți scrie proiectele din ele.
howto.cv.4=CV-urile adaptate de Claude la joburi sunt listate aici, fiecare cu PDF-ul lui.
howto.cv.tip=Claude nu adaugă niciodată o abilitate, un job sau o cifră pe care CV-ul tău nu le are.
howto.apply.intro=Claude aplică în locul tău la joburile salvate, în propriul tău Chrome, cu conturile tale.
howto.apply.1=Completează-ți răspunsurile o dată: unde poți lucra, viză, preaviz, așteptări salariale, scrisori de intenție și întrebările tale.
howto.apply.2=Bifează joburile, alege dacă Claude trimite fiecare formular sau îl completează ca să-l verifici, și lipește promptul în Claude Code cu Claude în Chrome (claude --chrome).
howto.apply.3=Pentru fiecare job, Claude îți adaptează CV-ul, îl încarcă împreună cu scrisoarea de intenție a jobului și răspunde doar cu răspunsurile tale: o întrebare pe care nu o acoperă oprește jobul și te așteaptă aici.
howto.apply.4=Fiecare job arată cum a mers; unul la care Claude a aplicat trece la Trimisă.
howto.apply.tip=Claude sare peste LinkedIn Easy Apply și peste site-urile care interzic aplicarea automată, și se oprește la un CAPTCHA ca să-l rezolvi tu.
howto.offers.intro=Ofertele tale una lângă alta, față de cât plătește piața.
howto.offers.1=Când un job ajunge la Ofertă, scrie condițiile pe pagina lui: salariul de bază, bonusul, acțiunile, concediul, data de început și până când răspunzi.
howto.offers.2=Alege moneda și perioada, plus rolul și limbajul cu care compari piața.
howto.offers.3=Fiecare coloană arată salariul într-o monedă, cât de departe e de piața din țara lui, potrivirea și zilele rămase până la răspuns; cea mai bine plătită e marcată.
howto.offers.4=Dă clic pe o ofertă ca să deschizi jobul, și întreabă-l pe Claude cum s-o negociezi: ce să ceri, minimul acceptat, ce să spui și un email.
howto.offers.tip=Cifrele pieței vin de pe pagina Salarii: încarcă acolo sondajul Stack Overflow pentru cele mai multe țări.
howto.letters.intro=Scrisoarea de intenție a fiecărui job și mesajele lui către cei care angajează, într-un singur loc.
howto.letters.1=Scrie o dată scrisoarea de bază: vocea ta și paragrafele pe care le folosești mereu. Unde vin compania și rolul, scrie {company} și {role}: fiecare job le completează.
howto.letters.2=Alege un job din listă: scrisoarea și mesajele lui se deschid alături. Scrie scrisoarea tu, pornind de la scrisoarea de bază, sau cere-i lui Claude s-o scrie din CV-ul tău și din anunț.
howto.letters.3=Pentru mai multe odată, bifează joburile fără scrisoare și cere-i lui Claude: lipește singurul prompt în Claude Code, și le scrie una după alta.
howto.letters.4=Schimbă orice scrisoare, previzualizeaz-o, copiaz-o sau descarc-o ca PDF cu numele și datele tale de contact.
howto.letters.5=Sub scrisoare, Ia legătura păstrează o notă pentru LinkedIn și un email către cei care angajează pentru job, de trimis de tine.
howto.letters.tip=JobWarden nu trimite niciodată nimic: scrisorile și mesajele le trimiți tu. Joburile încheiate apar doar dacă au scrisoare.
howto.salaries.intro=Cât plătesc joburile tale, comparat într-o singură monedă, și cât plătește piața.
howto.salaries.1=Alege moneda și perioada: fiecare salariu e convertit la cursurile Băncii Centrale Europene.
howto.salaries.2=Cifrele dau mediana, jumătatea din mijloc și cel mai mare; graficul, intervalul fiecărui job.
howto.salaries.3=Un salariu pe care JobWarden nu-l poate citi apare mai jos, de corectat; sau corectează-l cu creionul de pe pagina jobului.
howto.salaries.4=Salariile pieței compară un rol și un limbaj între țări, din sondajul Stack Overflow, anunțurile Adzuna și Eurostat.
howto.salaries.tip=Adzuna are nevoie de o cheie gratuită: adaug-o în Setări → Salarii.
howto.statistics.intro=Cum au mers aplicările tale, numărat din istoricul joburilor, fără IA.
howto.statistics.1=La câte ai aplicat, cât de des ai primit răspuns, interviu sau ofertă, și cât au durat răspunsurile.
howto.statistics.2=Ce site-uri, și cine a aplicat (tu, Claude sau extensia), au primit cele mai multe răspunsuri.
howto.statistics.3=Dacă joburile punctate sus de Claude au dus mai des la interviuri: cât să te bazezi pe punctaje.
howto.statistics.4=Cerințele care ți-au lipsit cel mai des și de ce ai fost respins: la ce să lucrezi.
howto.statistics.tip=Joburile arhivate contează în continuare aici.
howto.settings.intro=Cum arată și ce limbă vorbește JobWarden, extensia de browser, Claude și datele tale.
howto.settings.1=Poza profilului, tema și limba.
howto.settings.2=Joburile tale: exportă-le în CSV, importă-le pe ale altui instrument sau arhivează-le pe cele vechi deodată.
howto.settings.3=Inbox: cât de des e citită căsuța și ce se întâmplă cu noutățile găsite în ea.
howto.settings.4=Extensia de browser și Claude: adresa serverului, id-ul profilului tău și comanda care conectează Claude Code la JobWarden.
howto.settings.5=Salarii: cheia Adzuna pentru salariile din anunțuri.
howto.settings.tip=Fiecare profil are joburile, CV-ul și setările lui.
howto.profiles.intro=Profilurile țin căutările de job separat: a ta și a unui prieten, sau angajare și freelance.
howto.profiles.1=Alege un profil ca să-l deschizi; meniul din josul barei laterale comută între ele.
howto.profiles.2=Creează unul cu un nume: pornește fără joburi, fără CV și cu setările lui.
howto.profiles.tip=Extensia de browser și Claude au nevoie de id-ul profilului, afișat sub numele lui.
