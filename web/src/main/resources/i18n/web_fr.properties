# How each page works, which its header’s button opens
help.button=Comment ça marche
help.done=Compris
howto.jobs.intro=Toutes les offres que vous suivez : enregistrées avec l’extension du navigateur, trouvées par l’assistant ou ajoutées à la main.
howto.jobs.1=Enregistrez des annonces avec l’extension du navigateur (Enregistrer, ou J’ai postulé), ou ajoutez-en une avec Ajouter une offre.
howto.jobs.2=Cherchez par titre ou entreprise, filtrez par statut et triez par n’importe quelle colonne. L’adresse garde vos choix : vous pouvez la mettre en favori.
howto.jobs.3=Cliquez sur une ligne pour ouvrir l’offre dans le panneau latéral, ou sur son titre pour sa propre page. Le nom du site ouvre l’annonce.
howto.jobs.4=Cochez des lignes pour en archiver ou en supprimer plusieurs à la fois. Les offres archivées quittent la liste, le suivi et le calendrier ; le filtre Archivées les montre, pour les restaurer.
howto.jobs.5=L’adéquation dit à quel point votre CV correspond au poste, une fois que l’assistant l’a noté : 4 et plus, c’est une bonne adéquation.
howto.jobs.tip=Paramètres → Vos postes exporte toutes les offres en CSV, importe celles d’un autre outil, et archive les anciennes d’un coup.
howto.job.intro=Tout sur une offre : son annonce, son historique, et ce que l’assistant prépare pour elle.
howto.job.1=Faites-la avancer avec les boutons de statut, ou ajoutez une étape datée à son historique : un entretien avec son heure, son format et son lieu, un refus avec sa raison.
howto.job.2=Un statut se dit une fois : Poste fermé ne peut pas suivre Poste fermé. Si le poste rouvre, marquez-le Poste rouvert ; il pourra ensuite fermer à nouveau. Les entretiens et les offres peuvent se répéter, à chaque tour.
howto.job.3=Demandez à l’assistant ce dont l’offre a besoin, chaque carte à part : l’adéquation, un CV à l’épreuve de l’IA, une lettre de motivation, des messages aux recruteurs, une préparation d’entretien et, à l’offre, comment négocier. Chacune donne une instruction à coller dans votre assistant, Claude Code ou Codex.
howto.job.4=Notez à qui parler et quand relancer ; posez des rappels sur les entretiens et les échéances.
howto.job.5=Les crayons corrigent le lieu et le salaire ; l’adresse de l’annonce l’ouvre.
howto.job.6=Archivez l’offre quand vous en avez fini : elle reste dans vos statistiques, et revient avec Restaurer.
howto.job.tip=Repliez une carte sur son titre avec sa flèche : cette carte reste repliée pour toutes les offres.
howto.newJob.intro=Ajoutez une offre trouvée sans l’extension du navigateur, par exemple grâce à une recommandation ou à un recruteur.
howto.newJob.1=Donnez-lui un titre ; le reste est facultatif : l’entreprise, le lieu, le salaire, le lien de l’annonce et sa description.
howto.newJob.2=Indiquez où elle en est, Enregistrée, Envoyée ou plus loin, et depuis quand.
howto.newJob.3=Enregistrez-la : elle s’ouvre sur sa propre page, où l’assistant peut la noter et adapter votre CV.
howto.newJob.tip=Avec l’extension du navigateur, enregistrer une annonce prend un clic, avec sa description et son logo.
howto.pipeline.intro=Vos offres en tableau, une colonne par statut.
howto.pipeline.1=Faites glisser une carte dans une autre colonne pour donner ce statut à l’offre, comme les boutons du panneau latéral.
howto.pipeline.2=Cliquez sur une carte pour ouvrir son offre dans le panneau latéral.
howto.pipeline.3=Tapez dans la recherche pour limiter chaque colonne aux offres dont le titre ou l’entreprise contient les mots.
howto.pipeline.4=Une colonne charge d’autres cartes quand vous défilez jusqu’à sa fin ; le nombre au-dessus les compte toutes.
howto.pipeline.tip=Les offres archivées ne sont pas sur le tableau : retrouvez-les dans Offres, sous Archivées.
howto.calendar.intro=Vos entretiens, changements de statut, échéances et jours de relance, par mois, semaine ou jour.
howto.calendar.1=Passez du mois à la semaine et au jour, et déplacez-vous avec les flèches ou Aujourd’hui.
howto.calendar.2=La légende choisit ce que le calendrier montre : entretiens, autres changements de statut, échéances, relances.
howto.calendar.3=Cliquez sur une entrée pour ouvrir son offre dans le panneau latéral. À venir liste les 30 prochains jours.
howto.calendar.4=Le réveil à côté d’une entrée d’À venir pose un rappel : à son heure, ou avant.
howto.calendar.5=S’abonner ajoute le calendrier à Apple Calendrier, Outlook ou Google Agenda. Choisissez ce qu’il montre, par exemple seulement les entretiens et les relances : chaque choix a sa propre adresse, vous pouvez donc vous abonner à plusieurs.
howto.calendar.tip=Quiconque a l’adresse d’un calendrier peut le lire : Nouvelle adresse désactive les anciennes.
howto.inbox.intro=Les e-mails des recruteurs, lus dans votre boîte, comme mises à jour de vos offres.
howto.inbox.1=Connectez votre boîte une fois, en IMAP avec un mot de passe d’application. JobWarden ne fait que la lire.
howto.inbox.2=Il reconnaît un refus, un entretien, une offre ou une confirmation aux mots de l’e-mail, et trouve l’offre par son entreprise et son titre.
howto.inbox.3=Appliquez une mise à jour pour la mettre dans l’historique de l’offre, choisissez l’offre s’il n’en a trouvé aucune, ou écartez-la. Ce que l’historique dit déjà n’ajoute rien.
howto.inbox.4=Dans Paramètres → Boîte de réception, choisissez la fréquence de lecture, et si JobWarden ou l’assistant trient les mises à jour tout seuls.
howto.inbox.tip=Rien ne change une offre sans vous, sauf si les Paramètres le disent.
howto.discover.intro=Là où votre assistant IA travaille pour vous, via le serveur MCP de JobWarden, avec votre propre abonnement : Claude Code avec Claude, ou Codex avec ChatGPT.
howto.discover.1=Choisissez ce que l’assistant doit faire : trouver des offres pour votre CV ou vos critères, lancer vos recherches enregistrées, vérifier quelles annonces ont fermé, noter vos offres, ou ranger celles sans réponse.
howto.discover.2=Collez l’instruction dans votre assistant, ou lancez la commande dans un terminal ; choisissez Claude Code ou Codex dans les paramètres. La boucle que donne la page traite chaque demande toute seule, toutes les quelques minutes.
howto.discover.3=Les offres que l’assistant trouve attendent ici sous forme de cartes, chacune avec ce qui la rend pertinente : enregistrez-la, postulez ou écartez-la, avec les boutons ou le clavier.
howto.discover.4=Chaque demande montre comment elle s’est passée et ce que l’assistant a fait.
howto.discover.tip=JobWarden n’appelle aucune IA lui-même et n’a besoin d’aucune clé d’API ; ce qui ne demande pas d’IA, il le fait tout de suite, gratuitement.
howto.search.intro=Le Créateur de recherches transforme ce que vous voulez en Warden Queries : des recherches prêtes à l’emploi pour les endroits où les offres sont publiées, une par plateforme.
howto.search.1=Décrivez le poste en une phrase, par exemple ingénieur backend senior, télétravail Europe, freelance, puis Remplir les filtres ; ou remplissez-les vous-même.
howto.search.2=Quoi : les intitulés, les compétences et les mots à exclure. Où : les lieux et les régions, et à distance, hybride ou sur site. Quels postes : le type de contrat et la date de publication.
howto.search.3=Où Google cherche : les sites carrières des entreprises, sur Lever, Greenhouse, Ashby et autres, où les offres paraissent souvent en premier. Ajoutez votre propre domaine si vous voulez.
howto.search.4=À droite, une Warden Query par plateforme : Google, LinkedIn, Reddit, X et les sites d’emploi à distance. Ses opérateurs, champs et expressions sont en couleur.
howto.search.5=Copiez une requête, ou Ouvrir la recherche pour la lancer dans un nouvel onglet.
howto.search.6=Enregistrer la recherche garde les filtres sous un nom. Filtres enregistrés les rouvre ; la Liste de suivi y compare les nouvelles offres des entreprises ; l’assistant les lance depuis sa page.
howto.search.tip=L’adresse garde les filtres : mettez-la en favori pour revenir à une recherche, ou partagez-la.
howto.hiring.intro=Les publications des recruteurs et des managers qui disent recruter, et les personnes derrière elles.
howto.hiring.1=Demandez à l’assistant des publications pour les postes et les lieux que vous donnez : il cherche sur LinkedIn, X et Reddit. JobWarden ne se connecte nulle part.
howto.hiring.2=Découvrir montre toutes les publications, les plus récentes d’abord, filtrées par date, pays, hashtag ou mots ; Abonnements, seulement les personnes que vous suivez.
howto.hiring.3=Suivez un recruteur depuis n’importe laquelle de ses publications, enregistrez une publication comme offre, ou masquez-la pour de bon.
howto.hiring.4=Recruteurs liste tout le monde, avec leur entreprise et leur provenance. Demandez à l’assistant des recruteurs pour vos postes, ou ajoutez-en un à la main.
howto.hiring.tip=Les contacts enregistrés sur vos offres apparaissent ici, suivis ; et la carte Prendre contact d’une offre leur écrit.
howto.cv.intro=Votre CV : ce que l’assistant lit pour trouver des offres, et la base de tout ce qu’il écrit pour vous.
howto.cv.1=Importez votre CV, en PDF, Word ou texte, ou remplissez les champs et JobWarden en crée un : prévisualisez-le et téléchargez-le en PDF.
howto.cv.2=Gardez vos histoires d’entretien dans la banque d’histoires, selon la méthode STAR, ou demandez à l’assistant de les ébaucher depuis votre CV ; complétez celles marquées À compléter.
howto.cv.3=Connectez GitHub, cochez les dépôts qui méritent d’être montrés, et demandez à l’assistant d’en écrire vos projets.
howto.cv.4=Les CV que l’assistant a adaptés à des offres sont listés ici, chacun avec son PDF.
howto.cv.tip=L’assistant n’ajoute jamais une compétence, un poste ou un chiffre que votre CV n’a pas.
howto.apply.intro=L’assistant postule pour vous aux offres enregistrées, dans votre propre Chrome, avec vos propres connexions : il faut pour cela Claude Code avec Claude in Chrome.
howto.apply.1=Remplissez vos réponses une fois : où vous pouvez travailler, visa, préavis, prétentions salariales, lettres de motivation, et vos propres questions.
howto.apply.2=Cochez les offres, choisissez si l’assistant envoie chaque formulaire ou le remplit pour que vous le vérifiiez, et collez l’instruction dans Claude Code avec Claude in Chrome (claude --chrome). Codex ne peut pas piloter votre navigateur.
howto.apply.3=Pour chaque offre, l’assistant adapte votre CV, l’envoie avec la lettre de motivation de l’offre, et ne répond qu’avec vos réponses : une question qu’elles ne couvrent pas arrête l’offre et vous attend ici.
howto.apply.4=Chaque offre montre comment ça s’est passé ; celle à laquelle l’assistant a postulé passe à Envoyée.
howto.apply.tip=L’assistant saute LinkedIn Easy Apply et les sites qui interdisent de postuler automatiquement, et s’arrête à un CAPTCHA pour que vous le résolviez.
howto.offers.intro=Vos offres côte à côte, face à ce que paie le marché.
howto.offers.1=Quand une offre arrive à Offre, saisissez ses conditions sur sa page : salaire de base, prime, actions, congés, date de début et date limite de réponse.
howto.offers.2=Choisissez la devise et la période, et le métier et le langage à comparer au marché.
howto.offers.3=Chaque colonne montre le salaire dans une devise, son écart avec le marché de son pays, l’adéquation et les jours restants pour répondre ; la mieux payée est marquée.
howto.offers.4=Cliquez sur une offre pour l’ouvrir, et demandez à l’assistant comment la négocier : quoi demander, le minimum à accepter, quoi dire, et un e-mail.
howto.offers.tip=Les chiffres du marché viennent de la page Salaires : chargez-y l’enquête Stack Overflow pour le plus de pays.
howto.letters.intro=La lettre de motivation de chaque poste, et ses messages aux personnes qui recrutent, au même endroit.
howto.letters.1=Écrivez votre lettre type une fois : votre ton, et les paragraphes que vous écrivez toujours. Là où vont l’entreprise et le poste, écrivez {company} et {role} : chaque poste les remplit.
howto.letters.2=Choisissez un poste dans la liste : sa lettre et ses messages s’ouvrent à côté. Rédigez la lettre vous-même, à partir de votre lettre type, ou demandez à l’assistant de l’écrire à partir de votre CV et de l’annonce.
howto.letters.3=Pour plusieurs à la fois, cochez les postes sans lettre et demandez à l’assistant : collez l’unique prompt dans votre assistant, et il les écrit l’une après l’autre.
howto.letters.4=Modifiez n’importe quelle lettre, prévisualisez-la, copiez-la, ou téléchargez-la en PDF avec votre nom et vos coordonnées.
howto.letters.5=Sous la lettre, Prendre contact garde une note LinkedIn et un e-mail aux personnes qui recrutent pour le poste, à envoyer vous-même.
howto.letters.tip=JobWarden n’envoie jamais rien : c’est vous qui envoyez les lettres et les messages. Les postes terminés ne s’affichent que s’ils ont une lettre.
howto.salaries.intro=Ce que paient vos offres, comparé dans une devise, et ce que paie le marché.
howto.salaries.1=Choisissez la devise et la période : chaque salaire est converti aux taux de la Banque centrale européenne.
howto.salaries.2=Les chiffres donnent la médiane, la moitié centrale et le plus haut ; le graphique, la fourchette de chaque offre.
howto.salaries.3=Un salaire que JobWarden ne sait pas lire est listé en dessous, à corriger ; ou corrigez-le avec le crayon sur la page de l’offre.
howto.salaries.4=Les salaires du marché comparent un métier et un langage d’un pays à l’autre, d’après l’enquête Stack Overflow, les annonces d’Adzuna et Eurostat.
howto.salaries.tip=Adzuna demande une clé gratuite : ajoutez-la dans Paramètres → Salaires.
howto.statistics.intro=Comment vos candidatures se sont passées, compté à partir des historiques des offres, sans IA.
howto.statistics.1=Combien de candidatures envoyées, combien de fois une réponse, un entretien ou une offre, et combien de temps les réponses ont pris.
howto.statistics.2=Quels sites, et qui a postulé (vous, l’assistant ou l’extension), ont eu le plus de réponses.
howto.statistics.3=Si les offres bien notées par l’assistant ont mené plus souvent à un entretien : à quel point se fier aux notes.
howto.statistics.4=Les exigences qui vous ont le plus manqué, et pourquoi on vous a refusé : sur quoi travailler.
howto.statistics.tip=Les offres archivées comptent toujours ici.
howto.settings.intro=L’apparence et la langue de JobWarden, l’extension du navigateur, l’assistant, et vos données.
howto.settings.1=La photo de votre profil, le thème et la langue.
howto.settings.2=Vos postes : exportez-les en CSV, importez ceux d’un autre outil, ou archivez les anciens d’un coup.
howto.settings.3=Boîte de réception : à quelle fréquence votre boîte est lue, et ce que deviennent les mises à jour qu’on y trouve.
howto.settings.4=Extension du navigateur et Assistant IA : l’adresse du serveur, l’identifiant de votre profil, l’assistant avec lequel vous travaillez, Claude Code ou Codex, et comment le connecter à JobWarden.
howto.settings.5=Salaires : la clé Adzuna pour les salaires des annonces.
howto.settings.tip=Chaque profil a ses propres offres, son CV et ses paramètres.
howto.profiles.intro=Les profils séparent les recherches d’emploi : la vôtre et celle d’un ami, ou le salariat et le freelance.
howto.profiles.1=Choisissez un profil pour l’ouvrir ; le menu en bas de la barre latérale passe de l’un à l’autre.
howto.profiles.2=Créez-en un avec un nom : il démarre sans offres, sans CV, avec ses propres paramètres.
howto.profiles.tip=L’extension du navigateur et l’assistant ont besoin de l’identifiant du profil, affiché sous son nom.
