search.faq=Questions
search.faq.boolean.question=Qu’est-ce qu’une recherche booléenne ?
search.faq.boolean.answer=Une recherche qui combine des mots-clés avec des opérateurs : OR entre les variantes, une espace ou AND entre les mots qui doivent tous apparaître, un signe moins ou NOT devant les mots à exclure, et des guillemets autour d’une expression exacte. Elle réduit des milliers de résultats aux postes qui correspondent.
search.faq.ats.question=Pourquoi chercher directement dans les logiciels de recrutement ?
search.faq.ats.answer=Les entreprises publient leurs offres sur des systèmes comme Lever, Greenhouse et Ashby, souvent avant de les diffuser sur les sites d’emploi, ou à leur place. Chercher sur ces sites avec Google trouve les postes à la source, avec moins de doublons et de cabinets.
search.faq.limit.question=Pourquoi la requête Google s’arrête-t-elle à 32 mots ?
search.faq.limit.answer=Google ignore tout ce qui suit les 32 premiers mots d’une recherche. Le générateur laisse de côté les termes qui ne tiennent pas, en commençant par les derniers, et le signale. Les autres plateformes reçoivent tous les termes.
search.faq.remote.question=Comment trouver des postes en télétravail en Europe ?
search.faq.remote.answer=Ajoutez Europe, EMEA ou remote EU comme lieu et choisissez Télétravail comme mode de travail. L’onglet Sites d’emploi en télétravail cherche sur des sites qui ne publient que des postes à distance.
