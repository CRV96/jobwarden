search.faq.query.question=Warden Query क्या है?
search.faq.query.answer=JobWarden जो खोजें बनाता है उनका नाम, जिसे रिक्रूटर बूलियन खोज कहते हैं: ऑपरेटरों से जुड़े कीवर्ड। विकल्पों के बीच OR, उन शब्दों के बीच स्पेस या AND जो सब होने चाहिए, छोड़ने वाले शब्दों से पहले माइनस या NOT, और सटीक वाक्यांश के चारों ओर उद्धरण चिह्न। हर प्लेटफ़ॉर्म को उसकी अपनी सिंटैक्स में एक मिलती है, जो हज़ारों नतीजों को सही नौकरियों तक घटाती है।
search.faq.ats.question=आवेदक ट्रैकिंग सिस्टम को सीधे क्यों खोजें?
search.faq.ats.answer=कंपनियाँ अपनी नौकरियाँ Lever, Greenhouse और Ashby जैसे सिस्टम पर प्रकाशित करती हैं, अक्सर जॉब बोर्ड पर डालने से पहले, या उसकी जगह। Google पर इन साइटों को खोजने से नौकरियाँ सीधे स्रोत से मिलती हैं, कम दोबारा-पोस्ट और एजेंसियों के साथ।
search.faq.limit.question=Google क्वेरी 32 शब्दों पर क्यों रुकती है?
search.faq.limit.answer=Google किसी खोज के पहले 32 शब्दों के बाद सब कुछ अनदेखा करता है। जनरेटर उन शब्दों को छोड़ देता है जो नहीं समाते, आख़िरी वाले पहले, और ऐसा करने पर बताता है। बाक़ी प्लेटफ़ॉर्म को हर शब्द मिलता है।
search.faq.remote.question=यूरोप में रिमोट नौकरियाँ कैसे ढूँढूँ?
