howto.job.1=स्टेटस बटन से उसे आगे बढ़ाएँ, या उसकी टाइमलाइन में तारीख़ वाला क़दम जोड़ें: समय, तरीक़े और जगह के साथ इंटरव्यू, या कारण के साथ अस्वीकृति।
howto.job.2=एक स्टेटस एक बार कहा जाता है: पद बंद के बाद पद बंद नहीं आ सकता। अगर पद फिर से खुले, तो उसे पद फिर से खुला चिह्नित करें; फिर वह दोबारा बंद हो सकता है। इंटरव्यू और ऑफ़र हर दौर के लिए दोहराए जा सकते हैं।
howto.job.3=नौकरी को जो चाहिए वह सहायक से माँगें, हर कार्ड अलग से: मेल, AI-प्रूफ़ CV, कवर लेटर, भर्ती करने वालों को संदेश, इंटरव्यू की तैयारी, और ऑफ़र पर मोलभाव कैसे करें। हर एक आपके सहायक, Claude Code या Codex, में पेस्ट करने के लिए एक प्रॉम्प्ट देता है।
howto.job.4=किससे बात करनी है और कब फ़ॉलो-अप करना है, रखें; इंटरव्यू और समय-सीमाओं पर रिमाइंडर लगाएँ।
howto.job.5=पेंसिल जगह और वेतन ठीक करती हैं; पोस्टिंग का पता उसे खोलता है।
howto.job.6=जब काम पूरा हो जाए तो नौकरी संग्रहित करें: वह आपके आँकड़ों में रहती है, और वापस लाएँ से लौट आती है।
howto.job.tip=किसी कार्ड को उसके तीर से शीर्षक तक समेटें: वह कार्ड हर नौकरी पर समेटा रहता है।
howto.newJob.intro=ऐसी नौकरी जोड़ें जो आपको ब्राउज़र एक्सटेंशन के बिना मिली, जैसे किसी रेफ़रल या रिक्रूटर से।
howto.newJob.1=उसे एक शीर्षक दें; बाक़ी वैकल्पिक है: कंपनी, जगह, वेतन, पोस्टिंग का लिंक और उसका विवरण।
howto.newJob.2=चुनें कि वह कहाँ है, सहेजी गई, आवेदन किया या आगे, और कब से।
howto.newJob.3=इसे सहेजें: यह अपने पेज पर खुलती है, जहाँ सहायक इसे स्कोर कर सकता है और आपका CV इसके लिए ढाल सकता है।
howto.newJob.tip=ब्राउज़र एक्सटेंशन से पोस्टिंग सहेजना एक क्लिक है, उसके विवरण और लोगो के साथ।
howto.pipeline.intro=आपकी नौकरियाँ एक बोर्ड की तरह, हर स्टेटस के लिए एक कॉलम।
howto.pipeline.1=किसी कार्ड को दूसरे कॉलम में खींचें ताकि नौकरी को वह स्टेटस मिले, जैसे साइड पैनल के बटन करते हैं।
howto.pipeline.2=नौकरी को साइड पैनल में खोलने के लिए कार्ड पर क्लिक करें।
howto.pipeline.3=हर कॉलम को उन नौकरियों तक सीमित करने के लिए खोज में लिखें जिनके शीर्षक या कंपनी में वे शब्द हों।
howto.pipeline.4=कॉलम के अंत तक स्क्रॉल करने पर वह और कार्ड लोड करता है; ऊपर की संख्या सभी को गिनती है।
howto.pipeline.tip=संग्रहित नौकरियाँ बोर्ड पर नहीं हैं: उन्हें नौकरियाँ में, संग्रहित के अंदर देखें।
howto.calendar.intro=आपके इंटरव्यू, स्टेटस बदलाव, समय-सीमाएँ और फ़ॉलो-अप के दिन, महीने, हफ़्ते या दिन के हिसाब से।
howto.calendar.1=महीने, हफ़्ते और दिन के बीच बदलें, और तीरों या आज से आगे-पीछे जाएँ।
howto.calendar.2=लीजेंड चुनता है कि कैलेंडर क्या दिखाए: इंटरव्यू, दूसरे स्टेटस बदलाव, समय-सीमाएँ, फ़ॉलो-अप।
howto.calendar.3=किसी एंट्री की नौकरी साइड पैनल में खोलने के लिए उस पर क्लिक करें। आने वाले अगले 30 दिन दिखाता है।
howto.calendar.4=आने वाले में किसी एंट्री के पास की अलार्म घड़ी रिमाइंडर लगाती है: उसके समय पर, या पहले।
howto.calendar.5=सब्सक्राइब करें कैलेंडर को Apple Calendar, Outlook या Google Calendar में जोड़ता है। चुनें कि यह क्या दिखाए, जैसे केवल इंटरव्यू और फ़ॉलो-अप: हर चुनाव का अपना पता होता है, इसलिए आप कई सब्सक्राइब कर सकते हैं।
howto.calendar.tip=जिसके पास कैलेंडर का पता है वह उसे पढ़ सकता है: नया पता पुराने पते बंद कर देता है।
howto.inbox.intro=रिक्रूटरों के ईमेल, आपके मेलबॉक्स से पढ़े गए, आपकी नौकरियों के अपडेट के रूप में।
howto.inbox.1=अपना मेलबॉक्स एक बार जोड़ें, IMAP से, ऐप पासवर्ड के साथ। JobWarden उसे केवल पढ़ता है।
howto.inbox.2=यह ईमेल के शब्दों से अस्वीकृति, इंटरव्यू, ऑफ़र या पुष्टि पहचानता है, और कंपनी व शीर्षक से नौकरी ढूँढता है।
howto.inbox.3=अपडेट को नौकरी की टाइमलाइन में डालने के लिए लागू करें, कोई न मिले तो नौकरी चुनें, या उसे छोड़ दें। जो टाइमलाइन पहले से कहती है, वह कुछ नहीं जोड़ता।
howto.inbox.4=सेटिंग्स → इनबॉक्स में चुनें कि यह कितनी बार पढ़े, और क्या JobWarden, या सहायक, अपडेट ख़ुद छाँटे।
howto.inbox.tip=आपके बिना कोई चीज़ नौकरी नहीं बदलती, जब तक सेटिंग्स ऐसा न कहें।
howto.discover.intro=जहाँ आपका सहायक आपके लिए काम करता है, JobWarden के MCP सर्वर से, आपकी अपनी सदस्यता पर: Claude के साथ Claude Code, या ChatGPT के साथ Codex।
howto.discover.1=चुनें कि सहायक क्या करे: आपके CV या ज़रूरतों के लिए नौकरियाँ खोजे, सहेजी गई खोजें चलाए, जाँचे कि कौन-सी पोस्टिंग बंद हुईं, आपकी नौकरियाँ स्कोर करे, या बिना जवाब वाली नौकरियाँ सँभाले।
howto.discover.2=प्रॉम्प्ट अपने सहायक में पेस्ट करें, या कमांड टर्मिनल में चलाएँ; Claude Code या Codex सेटिंग्स में चुनें। पेज जो लूप देता है वह हर अनुरोध ख़ुद करता है, हर कुछ मिनट में।
howto.discover.3=सहायक की खोजी नौकरियाँ यहाँ कार्ड के रूप में इंतज़ार करती हैं, हर एक के कारण के साथ: उसे सहेजें, आवेदन करें या छोड़ दें, बटनों या कीबोर्ड से।
howto.discover.4=हर अनुरोध दिखाता है कि वह कैसा गया और सहायक ने क्या किया।
howto.discover.tip=JobWarden ख़ुद कोई AI नहीं बुलाता और उसे API कुंजी नहीं चाहिए; जिसमें AI नहीं लगता, वह तुरंत, मुफ़्त करता है।
howto.search.intro=सर्च बिल्डर आप जो चाहते हैं उसे Warden Queries में बदलता है: नौकरियाँ जहाँ छपती हैं उनके लिए तैयार खोजें, हर प्लेटफ़ॉर्म के लिए एक।
howto.search.1=नौकरी को एक वाक्य में बताएँ, जैसे सीनियर बैकएंड इंजीनियर, रिमोट यूरोप, कॉन्ट्रैक्ट, और फ़िल्टर भरें दबाएँ; या उन्हें ख़ुद भरें।
howto.search.2=क्या: नौकरी के शीर्षक, कौशल और छोड़ने वाले शब्द। कहाँ: जगहें और क्षेत्र, और रिमोट, हाइब्रिड या दफ़्तर से। कौन-सी नौकरियाँ: रोज़गार का प्रकार और कितनी नई।
howto.search.3=Google कहाँ देखता है: कंपनियों की करियर साइटें, Lever, Greenhouse, Ashby जैसी जगहों पर, जहाँ नौकरियाँ अक्सर पहले आती हैं। चाहें तो अपना डोमेन जोड़ें।
howto.search.4=दाईं ओर, हर प्लेटफ़ॉर्म के लिए एक Warden Query: Google, LinkedIn, Reddit, X और रिमोट जॉब बोर्ड। उसके ऑपरेटर, फ़ील्ड और वाक्यांश रंगीन होते हैं।
howto.search.5=कोई क्वेरी कॉपी करें, या उसे नए टैब में चलाने के लिए खोज खोलें दबाएँ।
howto.search.6=खोज सहेजें फ़िल्टरों को एक नाम से रखता है। सहेजे गए फ़िल्टर उन्हें फिर खोलता है; वॉचलिस्ट कंपनियों की नई नौकरियों को उनसे मिलाती है; सहायक उन्हें अपने पेज से चलाता है।
howto.search.tip=पता फ़िल्टर याद रखता है: किसी खोज पर लौटने के लिए उसे बुकमार्क करें, या साझा करें।
howto.hiring.intro=रिक्रूटरों और हायरिंग मैनेजरों की पोस्ट जो कहती हैं कि वे भर्ती कर रहे हैं, और उनके पीछे के लोग।
howto.hiring.1=आपकी दी गई भूमिकाओं और जगहों के लिए सहायक से पोस्ट माँगें: वह LinkedIn, X और Reddit पर खोजता है। JobWarden कहीं लॉग इन नहीं करता।
howto.hiring.2=खोजें हर पोस्ट दिखाता है, नई पहले, समय, देश, हैशटैग या शब्दों से फ़िल्टर; फ़ॉलो कर रहे हैं केवल उन लोगों की जिन्हें आप फ़ॉलो करते हैं।
howto.hiring.3=किसी रिक्रूटर को उसकी किसी भी पोस्ट से फ़ॉलो करें, पोस्ट को नौकरी के रूप में सहेजें, या उसे हमेशा के लिए छिपाएँ।
howto.hiring.4=रिक्रूटर सबको दिखाता है, उनकी कंपनी और वे कैसे आए। सहायक से अपनी भूमिकाओं के लिए रिक्रूटर माँगें, या किसी को हाथ से जोड़ें।
howto.hiring.tip=आपकी नौकरियों पर सहेजे गए संपर्क यहाँ फ़ॉलो किए हुए दिखते हैं; और नौकरी का संपर्क करें कार्ड उन्हें लिखता है।
howto.cv.intro=आपका CV: सहायक नौकरियाँ खोजने के लिए जो पढ़ता है, और आपके लिए जो कुछ लिखता है उसकी नींव।
howto.cv.1=अपना CV अपलोड करें, PDF, Word या टेक्स्ट के रूप में, या फ़ील्ड भरें और JobWarden एक बना देता है: उसका पूर्वावलोकन देखें और PDF डाउनलोड करें।
howto.cv.2=इंटरव्यू की अपनी कहानियाँ कहानी बैंक में रखें, STAR तरीके से, या सहायक से अपने CV से उनका मसौदा बनवाएँ; पूरा करना है वाली कहानियाँ पूरी करें।
howto.cv.3=GitHub जोड़ें, दिखाने लायक़ रिपॉज़िटरी चुनें, और सहायक से उनसे आपके प्रोजेक्ट लिखवाएँ।
howto.cv.4=सहायक ने जो CV नौकरियों के लिए ढाले वे यहाँ हैं, हर एक अपने PDF के साथ।
howto.cv.tip=सहायक कभी कोई कौशल, नौकरी या संख्या नहीं जोड़ता जो आपके CV में न हो।
howto.apply.intro=सहायक आपकी सहेजी गई नौकरियों पर आपके लिए आवेदन करता है, आपके अपने Chrome में, आपके अपने लॉगिन से: इसके लिए Claude in Chrome के साथ Claude Code चाहिए।
howto.apply.1=अपने जवाब एक बार भरें: आप कहाँ काम कर सकते हैं, वीज़ा, नोटिस अवधि, वेतन अपेक्षा, कवर लेटर, और आपके अपने सवाल।
howto.apply.2=नौकरियाँ चुनें, तय करें कि सहायक हर फ़ॉर्म भेजे या जाँचने के लिए भरकर छोड़े, और प्रॉम्प्ट Claude in Chrome के साथ Claude Code में पेस्ट करें (claude --chrome)। Codex आपका ब्राउज़र नहीं चला सकता।
howto.apply.3=हर नौकरी के लिए सहायक आपका CV ढालता है, उसे नौकरी के कवर लेटर के साथ अपलोड करता है, और केवल आपके जवाबों से जवाब देता है: जिस सवाल का जवाब उनमें नहीं है, वह नौकरी रोक देता है और यहाँ आपका इंतज़ार करता है।
howto.apply.4=हर नौकरी दिखाती है कि कैसा गया; जिस पर सहायक ने आवेदन किया वह आवेदन किया में चली जाती है।
howto.apply.tip=सहायक LinkedIn Easy Apply और स्वचालित आवेदन मना करने वाली साइटों को छोड़ देता है, और CAPTCHA पर रुककर आपसे हल करवाता है।
howto.offers.intro=आपके ऑफ़र साथ-साथ, बाज़ार जितना देता है उसके मुक़ाबले।
howto.offers.1=जब कोई नौकरी ऑफ़र तक पहुँचे, उसके पेज पर शर्तें लिखें: मूल वेतन, बोनस, इक्विटी, छुट्टियाँ, शुरुआत की तारीख़ और जवाब की आख़िरी तारीख़।
howto.offers.2=मुद्रा और अवधि चुनें, और बाज़ार से तुलना के लिए भूमिका और भाषा।
howto.offers.3=हर कॉलम वेतन एक मुद्रा में दिखाता है, वह अपने देश के बाज़ार से कितना दूर है, मेल और जवाब के बचे दिन; सबसे ज़्यादा देने वाला चिह्नित होता है।
howto.offers.4=नौकरी खोलने के लिए ऑफ़र पर क्लिक करें, और सहायक से पूछें कि मोलभाव कैसे करें: क्या माँगें, कम से कम क्या स्वीकार करें, क्या कहें, और एक ईमेल।
howto.offers.tip=बाज़ार के आँकड़े वेतन पेज से आते हैं: सबसे ज़्यादा देशों के लिए वहाँ Stack Overflow सर्वे लोड करें।
howto.letters.intro=हर नौकरी का कवर लेटर, और भर्ती करने वालों को उसके संदेश, एक जगह।
howto.letters.1=अपना बेस लेटर एक बार लिखें: आपकी आवाज़, और वे पैराग्राफ़ जो आप हमेशा लिखते हैं। जहाँ कंपनी और पद आते हैं, वहाँ {company} और {role} लिखें: हर नौकरी उन्हें भर देती है।
howto.letters.2=सूची में एक नौकरी चुनें: उसका लेटर और संदेश बगल में खुलते हैं। लेटर ख़ुद लिखें, अपने बेस लेटर से शुरू करके, या सहायक से अपने CV और पोस्टिंग से लिखवाएँ।
howto.letters.3=एक साथ कई के लिए, बिना लेटर वाली नौकरियाँ चुनें और सहायक से कहें: एक ही प्रॉम्प्ट अपने सहायक में पेस्ट करें, और वह उन्हें एक-एक करके लिखता है।
howto.letters.4=कोई भी लेटर बदलें, उसका प्रीव्यू देखें, कॉपी करें, या अपने नाम और संपर्क विवरण के साथ PDF के रूप में डाउनलोड करें।
howto.letters.5=लेटर के नीचे, संपर्क करें में नौकरी के लिए भर्ती करने वालों के लिए एक LinkedIn नोट और एक ईमेल रहता है, जिसे आप ख़ुद भेजते हैं।
howto.letters.tip=JobWarden कभी कुछ नहीं भेजता: लेटर और संदेश आप ख़ुद भेजते हैं। ख़त्म हुई नौकरियाँ तभी दिखती हैं जब उनका लेटर हो।
howto.salaries.intro=आपकी नौकरियाँ कितना देती हैं, एक मुद्रा में तुलना, और बाज़ार कितना देता है।
howto.salaries.1=मुद्रा और अवधि चुनें: हर वेतन यूरोपीय सेंट्रल बैंक की दरों से बदला जाता है।
howto.salaries.2=आँकड़े मीडियन, बीच का आधा और सबसे ऊँचा देते हैं; चार्ट, हर नौकरी की रेंज।
howto.salaries.3=जो वेतन JobWarden पढ़ नहीं पाता, वह नीचे ठीक करने के लिए दिखता है; या नौकरी के पेज पर पेंसिल से ठीक करें।
howto.salaries.4=बाज़ार वेतन किसी भूमिका और भाषा की देशों में तुलना करते हैं, Stack Overflow सर्वे, Adzuna के विज्ञापनों और Eurostat से।
howto.salaries.tip=Adzuna को एक मुफ़्त कुंजी चाहिए: उसे सेटिंग्स → वेतन में जोड़ें।
howto.statistics.intro=आपके आवेदन कैसे रहे, नौकरियों की टाइमलाइन से गिना गया, बिना AI के।
howto.statistics.1=आपने कितनों पर आवेदन किया, कितनी बार जवाब, इंटरव्यू या ऑफ़र आया, और जवाबों में कितना समय लगा।
howto.statistics.2=किन साइटों को, और किसने आवेदन किया (आप, सहायक या एक्सटेंशन), सबसे ज़्यादा जवाब मिले।
howto.statistics.3=क्या सहायक ने जिन नौकरियों को ऊँचा स्कोर दिया, उनमें इंटरव्यू ज़्यादा आए: स्कोर पर कितना भरोसा करें।
howto.statistics.4=जो ज़रूरतें आपके पास सबसे ज़्यादा नहीं थीं, और आपको क्यों अस्वीकार किया गया: किस पर काम करें।
howto.statistics.tip=संग्रहित नौकरियाँ यहाँ गिनी जाती रहती हैं।
howto.settings.intro=JobWarden कैसा दिखता और बोलता है, ब्राउज़र एक्सटेंशन, सहायक, और आपका डेटा।
howto.settings.1=आपके प्रोफ़ाइल की फ़ोटो, थीम और भाषा।
howto.settings.2=आपकी नौकरियाँ: उन्हें CSV में निर्यात करें, किसी दूसरे टूल की आयात करें, या पुरानी एक साथ संग्रहित करें।
howto.settings.3=इनबॉक्स: आपका मेलबॉक्स कितनी बार पढ़ा जाता है, और उसमें मिले अपडेट का क्या होता है।
howto.settings.4=ब्राउज़र एक्सटेंशन और सहायक: सर्वर का पता, आपके प्रोफ़ाइल की id, आप किस सहायक के साथ काम करते हैं, Claude Code या Codex, और उसे JobWarden से कैसे जोड़ें।
howto.settings.5=वेतन: विज्ञापनों के वेतन के लिए Adzuna कुंजी।
howto.settings.tip=हर प्रोफ़ाइल की अपनी नौकरियाँ, CV और सेटिंग्स होती हैं।
howto.profiles.intro=प्रोफ़ाइल नौकरी की खोजों को अलग रखते हैं: आपकी और किसी दोस्त की, या फ़ुल-टाइम और फ़्रीलांस।
howto.profiles.1=प्रोफ़ाइल खोलने के लिए उसे चुनें; साइडबार के नीचे का मेनू उनके बीच बदलता है।
howto.profiles.2=एक नाम के साथ नया बनाएँ: यह बिना नौकरियों, बिना CV और अपनी सेटिंग्स के साथ शुरू होता है।
howto.profiles.tip=ब्राउज़र एक्सटेंशन और सहायक को प्रोफ़ाइल की id चाहिए, जो उसके नाम के नीचे दिखती है।
