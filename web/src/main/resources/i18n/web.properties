search.faq=Questions
search.faq.boolean.question=What is a Boolean search?
search.faq.boolean.answer=A search that combines keywords with operators: OR between alternatives, a space or AND between words that must all appear, a minus or NOT before words to leave out, and quotes around an exact phrase. It narrows thousands of results down to the jobs that fit.
search.faq.ats.question=Why search the applicant tracking systems directly?
search.faq.ats.answer=Companies publish their openings on systems like Lever, Greenhouse and Ashby, often before posting them on job boards, or instead of it. Searching those sites on Google finds jobs straight from the source, with fewer reposts and agencies.
search.faq.limit.question=Why does the Google query stop at 32 words?
search.faq.limit.answer=Google ignores everything after the first 32 words of a search. The generator leaves out the terms that don’t fit, the last ones first, and says when it does. The other platforms get every term.
search.faq.remote.question=How do I find remote jobs in Europe?
search.faq.remote.answer=Add Europe, EMEA or remote EU as the location and pick Remote as the work type. The Remote job boards tab searches sites that only list remote jobs.
