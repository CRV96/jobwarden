# How each page works, which its header’s button opens
help.button=How it works
help.done=Got it
howto.jobs.intro=Every job you track: saved with the browser extension, found by the assistant, or added by hand.
howto.jobs.1=Save postings with the browser extension (Save, or I applied), or add one with Add job.
howto.jobs.2=Search by title or company, filter by status and sort by any column. The address keeps your choices, so you can bookmark them.
howto.jobs.3=Click a row to open the job in the side panel, or its title for its own page. The site’s name opens the posting.
howto.jobs.4=Tick rows to archive or delete several at once. Archived jobs leave the list, the pipeline and the calendar; the Archived filter shows them, to bring back.
howto.jobs.5=Fit is how well your CV matches the job, once the assistant scored it: 4 and up is a strong fit.
howto.jobs.tip=Settings → Your jobs exports every job as a CSV file, imports another tracker’s, and archives the old ones at once.
howto.job.intro=Everything about one job: its posting, its timeline, and what the assistant prepares for it.
howto.job.1=Move it on with the status buttons, or add a dated step to its timeline: an interview with its time, format and place, a rejection with its reason.
howto.job.2=A status is said once: Position closed can’t follow Position closed. When the position opens again, mark it Position re-opened; then it can close again. Interviews and offers can repeat, for each round.
howto.job.3=Ask the assistant for what the job needs, each card on its own: the fit score, an AI-proof CV, a cover letter, messages to the people hiring, an interview brief, and at Offer, how to negotiate. Each gives a prompt to paste into your assistant, Claude Code or Codex.
howto.job.4=Keep who to talk to and when to follow up; set reminders on interviews and deadlines.
howto.job.5=The pencils correct the location and the salary; the posting’s address opens it.
howto.job.6=Archive the job when you’re done with it: it stays in your statistics, and comes back with Bring back.
howto.job.tip=Fold a card to its title with its arrow: that card stays folded on every job.
howto.newJob.intro=Add a job you found without the browser extension, e.g. through a referral or a recruiter.
howto.newJob.1=Give it a title; the rest is optional: the company, the location, the salary, the posting’s link and its description.
howto.newJob.2=Pick where it stands, Saved or Applied or further, and since when.
howto.newJob.3=Save it: it opens on its own page, where the assistant can score it and tailor your CV to it.
howto.newJob.tip=With the browser extension, saving a posting takes one click, with its description and logo.
howto.pipeline.intro=Your jobs as a board, a column per status.
howto.pipeline.1=Drag a card to another column to give the job that status, as the side panel’s buttons do.
howto.pipeline.2=Click a card to open its job in the side panel.
howto.pipeline.3=Type in the search to narrow every column to the jobs whose title or company has the words.
howto.pipeline.4=A column loads more cards as you scroll to its end; the count above it is all of them.
howto.pipeline.tip=Archived jobs aren’t on the board: find them in Jobs, under Archived.
howto.calendar.intro=Your interviews, status changes, deadlines and days to follow up, by month, week or day.
howto.calendar.1=Switch between month, week and day, and move with the arrows or Today.
howto.calendar.2=The legend picks what the calendar shows: interviews, other status changes, deadlines, follow-ups.
howto.calendar.3=Click an entry to open its job in the side panel. Coming up lists the next 30 days.
howto.calendar.4=The alarm next to an entry of Coming up sets a reminder: at its time, or before it.
howto.calendar.5=Subscribe adds the calendar to Apple Calendar, Outlook or Google Calendar. Pick what it shows, e.g. only interviews and follow-ups: each choice is an address of its own, so you can subscribe to several.
howto.calendar.tip=Whoever has a feed’s address can read it: New address stops the old ones.
howto.inbox.intro=Recruiters’ emails, read from your mailbox, as updates to your jobs.
howto.inbox.1=Connect your mailbox once, over IMAP with an app password. JobWarden only reads it.
howto.inbox.2=It tells a rejection, an interview, an offer or a confirmation from the email’s words, and finds the job by its company and title.
howto.inbox.3=Apply an update to put it on the job’s timeline, pick the job when it found none, or dismiss it. An update the job’s timeline says already adds nothing.
howto.inbox.4=In Settings → Inbox, choose how often it reads, and whether JobWarden, or the assistant, sorts the updates on its own.
howto.inbox.tip=Nothing changes a job without you, unless Settings says so.
howto.discover.intro=Where your AI assistant works for you, through JobWarden’s MCP server, on your own plan: Claude Code with Claude, or Codex with ChatGPT.
howto.discover.1=Pick what the assistant should do: find jobs for your CV or your requirements, run your saved searches, check which postings closed, score your jobs, or tidy up those with no answer.
howto.discover.2=Paste the prompt into your assistant, or run the command in a terminal; choose Claude Code or Codex in the settings. The loop the page gives does every request on its own, every few minutes.
howto.discover.3=The jobs the assistant finds wait here as cards, each with why it fits: save it, apply to it or discard it, with the buttons or the keyboard.
howto.discover.4=Each request shows how it went, and what the assistant did.
howto.discover.tip=JobWarden calls no AI itself and needs no API key; what needs no AI, it does at once, for free.
howto.search.intro=The Search Builder turns what you want into Warden Queries: ready-made searches for the places jobs are posted, one for each platform.
howto.search.1=Describe the job in a sentence, e.g. senior backend engineer, remote Europe, contract, and Fill in the filters; or fill them in yourself.
howto.search.2=What: the job titles, the skills and the words to leave out. Where: the locations and regions, and remote, hybrid or on-site. Which jobs: the employment type and how recent.
howto.search.3=Where Google looks: the company career sites, on Lever, Greenhouse, Ashby and the like, where jobs often appear first. Add a domain of your own if you like.
howto.search.4=On the right, a Warden Query for each platform: Google, LinkedIn, Reddit, X and the remote job boards. Its operators, fields and phrases are in colour.
howto.search.5=Copy a query, or Open search to run it in a new tab.
howto.search.6=Save search keeps the filters under a name. Saved filters opens them again; the Watchlist matches the companies’ new jobs against them; the assistant runs them on its page.
howto.search.tip=The address keeps the filters: bookmark it to come back to a search, or share it.
howto.hiring.intro=Recruiters’ and hiring managers’ posts saying they’re hiring, and the people behind them.
howto.hiring.1=Ask the assistant for posts about the roles and places you give: it searches LinkedIn, X and Reddit. JobWarden signs in nowhere.
howto.hiring.2=Discover shows every post, the latest first, filtered by time, country, hashtag or words; Following, only the people you follow.
howto.hiring.3=Follow a recruiter from any of their posts, save a post as a job, or hide it for good.
howto.hiring.4=Recruiters lists everyone, with their company and how they came. Ask the assistant for recruiters who hire for your roles, or add one by hand.
howto.hiring.tip=The contacts you save on your jobs show up here, followed; and a job’s Reach out card writes to them.
howto.cv.intro=Your CV: what the assistant reads to find jobs, and the base of everything it writes for you.
howto.cv.1=Upload your CV, as a PDF, a Word document or text, or fill in the fields and JobWarden builds one: preview it, and download it as a PDF.
howto.cv.2=Keep your stories for interviews in the story bank, the STAR way, or ask the assistant to draft them from your CV; finish those marked To finish.
howto.cv.3=Connect GitHub, tick the repositories worth showing, and ask the assistant to write your projects from them.
howto.cv.4=The CVs the assistant tailored to jobs are listed here, each with its PDF.
howto.cv.tip=The assistant never adds a skill, a job or a number your CV doesn’t have.
howto.apply.intro=The assistant applies to your Saved jobs for you, in your own Chrome, with your own sign-ins: this takes Claude Code with Claude in Chrome.
howto.apply.1=Fill in your answers once: where you can work, sponsorship, notice period, salary expectation, cover letters, and your own questions.
howto.apply.2=Tick the jobs, choose whether the assistant sends each form or fills it in for you to check, and paste the prompt into Claude Code with Claude in Chrome (claude --chrome). Codex can’t drive your browser.
howto.apply.3=For each job, the assistant tailors your CV, uploads it with the job’s cover letter, and answers only from your answers: a question they don’t cover stops the job and waits for you here.
howto.apply.4=Each job shows how it went; one the assistant applied to moves to Applied.
howto.apply.tip=The assistant skips LinkedIn Easy Apply and the sites that forbid applying automatically, and stops at a CAPTCHA for you to solve.
howto.offers.intro=Your offers side by side, against what the market pays.
howto.offers.1=When a job gets to Offer, type its terms on its page: the base salary, bonus, equity, time off, the start date and when to answer by.
howto.offers.2=Pick the currency and the period, and the role and language to compare with the market.
howto.offers.3=Each column shows the salary in one currency, how far it is from the market in its country, the fit score and the days left to answer; the best paid is marked.
howto.offers.4=Click an offer to open its job, and ask the assistant how to negotiate it: what to ask for, the least to accept, what to say, and an email.
howto.offers.tip=The market’s figures come from the Salaries page: load the Stack Overflow survey there for the most countries.
howto.letters.intro=Every job’s cover letter, and its messages to the people hiring, in one place.
howto.letters.1=Write your base letter once: your voice, and the paragraphs you always use. Where the company and the role go, write {company} and {role}: each job fills them in.
howto.letters.2=Pick a job in the list: its letter and messages open beside it. Write the letter yourself, starting from your base letter, or ask the assistant to write it from your CV and the posting.
howto.letters.3=For several at once, tick the jobs without a letter and ask the assistant: paste the one prompt into your assistant, and it writes them one after the other.
howto.letters.4=Change any letter, preview it, copy it, or download it as a PDF with your name and contact details.
howto.letters.5=Under the letter, Reach out keeps a LinkedIn note and an email to the people hiring for the job, for you to send.
howto.letters.tip=JobWarden never sends anything: the letters and messages are yours to send. Jobs that ended show only when they have a letter.
howto.salaries.intro=What your jobs pay, compared in one currency, and what the market pays.
howto.salaries.1=Pick the currency and the period: every salary is converted at the European Central Bank’s rates.
howto.salaries.2=The figures give the median, the middle half and the highest; the chart, each job’s range.
howto.salaries.3=A salary JobWarden can’t read is listed below, to correct; or correct it with the pencil on the job’s page.
howto.salaries.4=Market salaries compare a role and a language across countries, from the Stack Overflow survey, Adzuna’s job ads and Eurostat.
howto.salaries.tip=Adzuna needs a free key: add it in Settings → Salaries.
howto.statistics.intro=How your applications went, counted from the jobs’ timelines, without AI.
howto.statistics.1=How many you applied to, how often they got an answer, an interview or an offer, and how long the answers took.
howto.statistics.2=Which sites, and who applied (you, the assistant or the extension), got the most answers.
howto.statistics.3=Whether the jobs the assistant scored high got interviews more often: how far to trust the scores.
howto.statistics.4=The requirements you missed most, and why you were turned down: what to work on.
howto.statistics.tip=Archived jobs still count here.
howto.settings.intro=How JobWarden looks and speaks, the browser extension, the assistant, and your data.
howto.settings.1=Your profile’s photo, the theme and the language.
howto.settings.2=Your jobs: export them as a CSV file, import another tracker’s, or archive the old ones at once.
howto.settings.3=Inbox: how often your mailbox is read, and what becomes of the updates found in it.
howto.settings.4=Browser extension and AI Assistant: the server’s address, your profile’s id, the assistant you work with, Claude Code or Codex, and how to connect it to JobWarden.
howto.settings.5=Salaries: the Adzuna key for the job ads’ salaries.
howto.settings.tip=Each profile keeps its own jobs, CV and settings.
howto.profiles.intro=Profiles keep job hunts apart: yours and a friend’s, or full-time and freelance.
howto.profiles.1=Pick a profile to open it; the menu at the bottom of the sidebar switches between them.
howto.profiles.2=Create one with a name: it starts with no jobs, no CV and its own settings.
howto.profiles.tip=The browser extension and the assistant need the profile’s id, shown under its name.
