search.faq=Fragen
search.faq.boolean.question=Was ist eine boolesche Suche?
search.faq.boolean.answer=Eine Suche, die Stichwörter mit Operatoren verbindet: OR zwischen Alternativen, ein Leerzeichen oder AND zwischen Wörtern, die alle vorkommen müssen, ein Minus oder NOT vor auszuschließenden Wörtern und Anführungszeichen um eine genaue Wortfolge. So schrumpfen Tausende Ergebnisse auf die passenden Stellen.
search.faq.ats.question=Warum direkt in den Bewerbermanagementsystemen suchen?
search.faq.ats.answer=Unternehmen veröffentlichen ihre Stellen in Systemen wie Lever, Greenhouse und Ashby, oft bevor sie sie auf Jobbörsen stellen, oder stattdessen. Eine Google-Suche auf diesen Websites findet Stellen direkt an der Quelle, mit weniger Duplikaten und Agenturen.
search.faq.limit.question=Warum endet die Google-Suchanfrage nach 32 Wörtern?
search.faq.limit.answer=Google ignoriert alles nach den ersten 32 Wörtern einer Suche. Der Generator lässt die Begriffe weg, die nicht mehr passen, die letzten zuerst, und weist darauf hin. Die anderen Plattformen bekommen alle Begriffe.
search.faq.remote.question=Wie finde ich Remote-Stellen in Europa?
search.faq.remote.answer=Gib Europe, EMEA oder remote EU als Ort an und wähle Remote als Arbeitsmodell. Der Tab Remote-Jobbörsen durchsucht Websites, die nur Remote-Stellen listen.
