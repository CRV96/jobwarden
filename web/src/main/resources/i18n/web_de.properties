# How each page works, which its header’s button opens
help.button=So funktioniert’s
help.done=Verstanden
howto.jobs.intro=Alle Stellen, die du verfolgst: mit der Browser-Erweiterung gespeichert, vom Assistenten gefunden oder von Hand hinzugefügt.
howto.jobs.1=Speichere Stellenanzeigen mit der Browser-Erweiterung (Speichern oder Ich habe mich beworben), oder füge eine mit Stelle hinzufügen hinzu.
howto.jobs.2=Suche nach Titel oder Firma, filtere nach Status und sortiere nach jeder Spalte. Die Adresse behält deine Auswahl, du kannst sie also als Lesezeichen speichern.
howto.jobs.3=Klicke auf eine Zeile, um die Stelle im Seitenbereich zu öffnen, oder auf ihren Titel für ihre eigene Seite. Der Name der Website öffnet die Anzeige.
howto.jobs.4=Hake Zeilen an, um mehrere auf einmal zu archivieren oder zu löschen. Archivierte Stellen verlassen die Liste, die Pipeline und den Kalender; der Filter Archiviert zeigt sie, zum Zurückholen.
howto.jobs.5=Passung zeigt, wie gut dein Lebenslauf zur Stelle passt, sobald der Assistent sie bewertet hat: ab 4 passt es gut.
howto.jobs.tip=Unter Einstellungen → Deine Stellen exportierst du alle Stellen als CSV, importierst die eines anderen Trackers und archivierst die alten auf einmal.
howto.job.intro=Alles zu einer Stelle: ihre Anzeige, ihr Verlauf und was der Assistent für sie vorbereitet.
howto.job.1=Bring sie mit den Status-Knöpfen weiter, oder füge ihrem Verlauf einen datierten Schritt hinzu: ein Gespräch mit Uhrzeit, Format und Ort, eine Absage mit ihrem Grund.
howto.job.2=Ein Status gilt einmal: Stelle geschlossen kann nicht auf Stelle geschlossen folgen. Wird die Stelle wieder geöffnet, markiere sie als Stelle wieder offen; dann kann sie wieder schließen. Gespräche und Angebote können sich wiederholen, Runde für Runde.
howto.job.3=Bitte den Assistenten um das, was die Stelle braucht, jede Karte für sich: die Passung, einen KI-sicheren Lebenslauf, ein Anschreiben, Nachrichten an die Leute, die einstellen, eine Gesprächsvorbereitung und beim Angebot, wie du verhandelst. Jede gibt dir einen Prompt für deinen Assistenten, Claude Code oder Codex.
howto.job.4=Halte fest, mit wem du sprichst und wann du nachfasst; setze Erinnerungen für Gespräche und Fristen.
howto.job.5=Die Stifte korrigieren Ort und Gehalt; die Adresse der Anzeige öffnet sie.
howto.job.6=Archiviere die Stelle, wenn du mit ihr fertig bist: Sie bleibt in deiner Statistik und kommt mit Zurückholen wieder.
howto.job.tip=Klappe eine Karte mit ihrem Pfeil auf ihren Titel zu: Diese Karte bleibt bei jeder Stelle zugeklappt.
howto.newJob.intro=Füge eine Stelle hinzu, die du ohne die Browser-Erweiterung gefunden hast, etwa über eine Empfehlung oder einen Recruiter.
howto.newJob.1=Gib ihr einen Titel; der Rest ist freiwillig: Firma, Ort, Gehalt, der Link zur Anzeige und ihre Beschreibung.
howto.newJob.2=Wähle, wo sie steht, Gemerkt, Beworben oder weiter, und seit wann.
howto.newJob.3=Speichere sie: Sie öffnet sich auf ihrer eigenen Seite, wo der Assistent sie bewerten und deinen Lebenslauf anpassen kann.
howto.newJob.tip=Mit der Browser-Erweiterung speicherst du eine Anzeige mit einem Klick, samt Beschreibung und Logo.
howto.pipeline.intro=Deine Stellen als Tafel, eine Spalte pro Status.
howto.pipeline.1=Zieh eine Karte in eine andere Spalte, um der Stelle diesen Status zu geben, wie die Knöpfe im Seitenbereich.
howto.pipeline.2=Klicke auf eine Karte, um ihre Stelle im Seitenbereich zu öffnen.
howto.pipeline.3=Tippe in die Suche, um jede Spalte auf die Stellen zu beschränken, deren Titel oder Firma die Wörter enthält.
howto.pipeline.4=Eine Spalte lädt mehr Karten, wenn du an ihr Ende scrollst; die Zahl darüber zählt alle.
howto.pipeline.tip=Archivierte Stellen sind nicht auf der Tafel: Du findest sie unter Stellen, Archiviert.
howto.calendar.intro=Deine Gespräche, Statusänderungen, Fristen und Tage zum Nachfassen, nach Monat, Woche oder Tag.
howto.calendar.1=Wechsle zwischen Monat, Woche und Tag und bewege dich mit den Pfeilen oder Heute.
howto.calendar.2=Die Legende wählt, was der Kalender zeigt: Gespräche, andere Statusänderungen, Fristen, Nachfassen.
howto.calendar.3=Klicke auf einen Eintrag, um seine Stelle im Seitenbereich zu öffnen. Demnächst listet die nächsten 30 Tage.
howto.calendar.4=Der Wecker neben einem Eintrag unter Demnächst setzt eine Erinnerung: zu seiner Zeit oder davor.
howto.calendar.5=Abonnieren fügt den Kalender zu Apple Kalender, Outlook oder Google Kalender hinzu. Wähle, was er zeigt, etwa nur Gespräche und Nachfassen: Jede Auswahl hat ihre eigene Adresse, du kannst also mehrere abonnieren.
howto.calendar.tip=Wer die Adresse eines Kalenders hat, kann ihn lesen: Neue Adresse macht die alten ungültig.
howto.inbox.intro=Die E-Mails von Recruitern, aus deinem Postfach gelesen, als Neuigkeiten zu deinen Stellen.
howto.inbox.1=Verbinde dein Postfach einmal, per IMAP mit einem App-Passwort. JobWarden liest es nur.
howto.inbox.2=Es erkennt an den Worten der E-Mail eine Absage, ein Gespräch, ein Angebot oder eine Bestätigung und findet die Stelle über Firma und Titel.
howto.inbox.3=Übernimm eine Neuigkeit in den Verlauf der Stelle, wähle die Stelle, wenn es keine fand, oder verwirf sie. Was der Verlauf schon sagt, fügt nichts hinzu.
howto.inbox.4=Unter Einstellungen → Posteingang wählst du, wie oft es liest und ob JobWarden oder der Assistent die Neuigkeiten selbst einsortieren.
howto.inbox.tip=Nichts ändert eine Stelle ohne dich, außer die Einstellungen sagen es.
howto.discover.intro=Hier arbeitet dein Assistent für dich, über den MCP-Server von JobWarden, mit deinem eigenen Abo: Claude Code mit Claude oder Codex mit ChatGPT.
howto.discover.1=Wähle, was der Assistent tun soll: Stellen für deinen Lebenslauf oder deine Anforderungen finden, deine gespeicherten Suchen ausführen, prüfen, welche Anzeigen geschlossen sind, deine Stellen bewerten oder die ohne Antwort aufräumen.
howto.discover.2=Füge den Prompt in deinen Assistenten ein oder führe den Befehl im Terminal aus; Claude Code oder Codex wählst du in den Einstellungen. Die Schleife der Seite erledigt jede Anfrage von selbst, alle paar Minuten.
howto.discover.3=Die Stellen, die der Assistent findet, warten hier als Karten, jede mit ihrem Grund: Speichere sie, bewirb dich oder verwirf sie, mit den Knöpfen oder der Tastatur.
howto.discover.4=Jede Anfrage zeigt, wie es lief und was der Assistent getan hat.
howto.discover.tip=JobWarden ruft selbst keine KI auf und braucht keinen API-Schlüssel; was keine KI braucht, erledigt es sofort und kostenlos.
howto.search.intro=Der Suchbaukasten macht aus dem, was du willst, Warden Queries: fertige Suchen für die Orte, an denen Stellen erscheinen, eine pro Plattform.
howto.search.1=Beschreibe die Stelle in einem Satz, etwa Senior Backend Engineer, remote Europa, Vertrag, und klicke Filter ausfüllen; oder fülle sie selbst aus.
howto.search.2=Was: die Jobtitel, die Fähigkeiten und die Wörter, die wegfallen sollen. Wo: die Orte und Regionen, und remote, hybrid oder vor Ort. Welche Stellen: die Anstellungsart und wie aktuell.
howto.search.3=Wo Google sucht: die Karriereseiten der Firmen, auf Lever, Greenhouse, Ashby und ähnlichen, wo Stellen oft zuerst erscheinen. Füge eine eigene Domain hinzu, wenn du willst.
howto.search.4=Rechts eine Warden Query pro Plattform: Google, LinkedIn, Reddit, X und die Remote-Jobbörsen. Ihre Operatoren, Felder und Phrasen sind farbig.
howto.search.5=Kopiere eine Query, oder klicke Suche öffnen, um sie in einem neuen Tab auszuführen.
howto.search.6=Suche speichern behält die Filter unter einem Namen. Gespeicherte Filter öffnet sie wieder; die Beobachtungsliste gleicht neue Stellen der Firmen damit ab; der Assistent führt sie auf seiner Seite aus.
howto.search.tip=Die Adresse behält die Filter: Speichere sie als Lesezeichen, um zu einer Suche zurückzukehren, oder teile sie.
howto.hiring.intro=Beiträge von Recruitern und Hiring Managern, die sagen, dass sie einstellen, und die Menschen dahinter.
howto.hiring.1=Bitte den Assistenten um Beiträge zu den Rollen und Orten, die du angibst: Er sucht auf LinkedIn, X und Reddit. JobWarden meldet sich nirgends an.
howto.hiring.2=Entdecken zeigt jeden Beitrag, die neuesten zuerst, gefiltert nach Zeit, Land, Hashtag oder Wörtern; Gefolgt nur die Leute, denen du folgst.
howto.hiring.3=Folge einem Recruiter über jeden seiner Beiträge, speichere einen Beitrag als Stelle oder blende ihn für immer aus.
howto.hiring.4=Recruiter listet alle, mit ihrer Firma und woher sie kamen. Bitte den Assistenten um Recruiter für deine Rollen, oder füge einen von Hand hinzu.
howto.hiring.tip=Die Kontakte, die du bei deinen Stellen speicherst, erscheinen hier als gefolgt; und die Karte Kontakt aufnehmen einer Stelle schreibt ihnen.
howto.cv.intro=Dein Lebenslauf: was der Assistent liest, um Stellen zu finden, und die Grundlage für alles, was er für dich schreibt.
howto.cv.1=Lade deinen Lebenslauf hoch, als PDF, Word-Dokument oder Text, oder fülle die Felder aus und JobWarden baut einen: sieh ihn dir an und lade ihn als PDF herunter.
howto.cv.2=Bewahre deine Geschichten für Gespräche in der Story-Sammlung auf, nach STAR, oder lass den Assistenten sie aus deinem Lebenslauf entwerfen; ergänze die als Zu ergänzen markierten.
howto.cv.3=Verbinde GitHub, hake die zeigenswerten Repositories an und lass den Assistenten daraus deine Projekte schreiben.
howto.cv.4=Die Lebensläufe, die der Assistent an Stellen angepasst hat, stehen hier, jeder mit seinem PDF.
howto.cv.tip=Der Assistent fügt nie eine Fähigkeit, eine Stelle oder eine Zahl hinzu, die dein Lebenslauf nicht hat.
howto.apply.intro=Der Assistent bewirbt sich für dich auf deine gemerkten Stellen, in deinem eigenen Chrome, mit deinen Anmeldungen: Dafür braucht es Claude Code mit Claude in Chrome.
howto.apply.1=Fülle deine Antworten einmal aus: wo du arbeiten darfst, Visum, Kündigungsfrist, Gehaltsvorstellung, Anschreiben und deine eigenen Fragen.
howto.apply.2=Hake die Stellen an, wähle, ob der Assistent jedes Formular sendet oder für dich zum Prüfen ausfüllt, und füge den Prompt in Claude Code mit Claude in Chrome ein (claude --chrome). Codex kann deinen Browser nicht steuern.
howto.apply.3=Für jede Stelle passt der Assistent deinen Lebenslauf an, lädt ihn mit dem Anschreiben der Stelle hoch und antwortet nur mit deinen Antworten: Eine Frage, die sie nicht abdecken, hält die Stelle an und wartet hier auf dich.
howto.apply.4=Jede Stelle zeigt, wie es lief; eine, auf die sich der Assistent beworben hat, wechselt zu Beworben.
howto.apply.tip=Der Assistent lässt LinkedIn Easy Apply und Seiten aus, die automatisches Bewerben verbieten, und hält bei einem CAPTCHA an, damit du es löst.
howto.offers.intro=Deine Angebote nebeneinander, verglichen mit dem, was der Markt zahlt.
howto.offers.1=Wenn eine Stelle bei Angebot ist, trag auf ihrer Seite die Bedingungen ein: Grundgehalt, Bonus, Beteiligung, Urlaub, Beginn und Antwortfrist.
howto.offers.2=Wähle Währung und Zeitraum, und die Rolle und Sprache für den Marktvergleich.
howto.offers.3=Jede Spalte zeigt das Gehalt in einer Währung, wie weit es vom Markt in seinem Land liegt, die Passung und die Tage bis zur Antwort; das bestbezahlte ist markiert.
howto.offers.4=Klicke auf ein Angebot, um seine Stelle zu öffnen, und frag den Assistenten, wie du es verhandelst: was du forderst, das Mindeste, was du sagst, und eine E-Mail.
howto.offers.tip=Die Marktzahlen kommen von der Gehaltsseite: Lade dort die Stack-Overflow-Umfrage für die meisten Länder.
howto.letters.intro=Das Anschreiben jeder Stelle und ihre Nachrichten an die Leute, die einstellen, an einem Ort.
howto.letters.1=Schreib einmal dein Basisanschreiben: deinen Ton und die Absätze, die du immer verwendest. Wo Firma und Stelle hingehören, schreib {company} und {role}: Jede Stelle füllt sie aus.
howto.letters.2=Wähle eine Stelle in der Liste: Ihr Anschreiben und ihre Nachrichten öffnen sich daneben. Schreib das Anschreiben selbst, ausgehend von deinem Basisanschreiben, oder lass es den Assistenten aus deinem Lebenslauf und der Anzeige schreiben.
howto.letters.3=Für mehrere auf einmal markiere die Stellen ohne Anschreiben und frag den Assistenten: Füge den einen Prompt in deinen Assistenten ein, und er schreibt sie nacheinander.
howto.letters.4=Ändere jedes Anschreiben, sieh es dir an, kopiere es oder lade es als PDF mit deinem Namen und deinen Kontaktdaten herunter.
howto.letters.5=Unter dem Anschreiben hält „Kontakt aufnehmen“ eine LinkedIn-Notiz und eine E-Mail an die Leute bereit, die für die Stelle einstellen, zum selbst Senden.
howto.letters.tip=JobWarden sendet nie etwas: Anschreiben und Nachrichten sendest du selbst. Beendete Stellen erscheinen nur, wenn sie ein Anschreiben haben.
howto.salaries.intro=Was deine Stellen zahlen, in einer Währung verglichen, und was der Markt zahlt.
howto.salaries.1=Wähle Währung und Zeitraum: Jedes Gehalt wird zu den Kursen der Europäischen Zentralbank umgerechnet.
howto.salaries.2=Die Zahlen zeigen den Median, die mittlere Hälfte und das höchste; das Diagramm die Spanne jeder Stelle.
howto.salaries.3=Ein Gehalt, das JobWarden nicht lesen kann, steht darunter zum Korrigieren; oder korrigiere es mit dem Stift auf der Seite der Stelle.
howto.salaries.4=Marktgehälter vergleichen eine Rolle und eine Sprache über Länder hinweg, aus der Stack-Overflow-Umfrage, Adzunas Stellenanzeigen und Eurostat.
howto.salaries.tip=Adzuna braucht einen kostenlosen Schlüssel: Trag ihn unter Einstellungen → Gehälter ein.
howto.statistics.intro=Wie deine Bewerbungen liefen, aus den Verläufen der Stellen gezählt, ohne KI.
howto.statistics.1=Auf wie viele du dich beworben hast, wie oft eine Antwort, ein Gespräch oder ein Angebot kam und wie lange die Antworten dauerten.
howto.statistics.2=Welche Websites, und wer sich beworben hat (du, der Assistent oder die Erweiterung), die meisten Antworten bekamen.
howto.statistics.3=Ob die Stellen, die der Assistent hoch bewertet hat, öfter zu Gesprächen führten: wie sehr du den Bewertungen trauen kannst.
howto.statistics.4=Die Anforderungen, die dir am häufigsten fehlten, und warum du abgelehnt wurdest: woran du arbeiten kannst.
howto.statistics.tip=Archivierte Stellen zählen hier weiter.
howto.settings.intro=Wie JobWarden aussieht und spricht, die Browser-Erweiterung, der Assistent und deine Daten.
howto.settings.1=Das Foto deines Profils, das Design und die Sprache.
howto.settings.2=Deine Stellen: exportiere sie als CSV, importiere die eines anderen Trackers oder archiviere die alten auf einmal.
howto.settings.3=Posteingang: wie oft dein Postfach gelesen wird und was aus den gefundenen Neuigkeiten wird.
howto.settings.4=Browser-Erweiterung und Assistent: die Adresse des Servers, die Id deines Profils, der Assistent, mit dem du arbeitest, Claude Code oder Codex, und wie du ihn mit JobWarden verbindest.
howto.settings.5=Gehälter: der Adzuna-Schlüssel für die Gehälter der Stellenanzeigen.
howto.settings.tip=Jedes Profil hat seine eigenen Stellen, seinen Lebenslauf und seine Einstellungen.
howto.profiles.intro=Profile halten Jobsuchen auseinander: deine und die eines Freundes, oder Festanstellung und Freelance.
howto.profiles.1=Wähle ein Profil, um es zu öffnen; das Menü unten in der Seitenleiste wechselt zwischen ihnen.
howto.profiles.2=Lege eines mit einem Namen an: Es beginnt ohne Stellen, ohne Lebenslauf und mit eigenen Einstellungen.
howto.profiles.tip=Die Browser-Erweiterung und der Assistent brauchen die Id des Profils, die unter seinem Namen steht.
