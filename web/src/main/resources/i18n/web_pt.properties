search.faq.boolean.question=O que é uma pesquisa booleana?
search.faq.boolean.answer=Uma pesquisa que combina palavras-chave com operadores: OR entre alternativas, um espaço ou AND entre palavras que têm de aparecer todas, um sinal de menos ou NOT antes das palavras a excluir e aspas à volta de uma expressão exata. Reduz milhares de resultados aos empregos que interessam.
search.faq.ats.question=Porquê pesquisar diretamente nos sistemas de recrutamento?
search.faq.ats.answer=As empresas publicam as vagas em sistemas como o Lever, o Greenhouse e o Ashby, muitas vezes antes de as publicarem nos portais de emprego, ou em vez disso. Pesquisar esses sites no Google encontra os empregos na origem, com menos duplicados e agências.
search.faq.limit.question=Porque é que a pesquisa do Google termina nas 32 palavras?
search.faq.limit.answer=O Google ignora tudo o que vem depois das primeiras 32 palavras de uma pesquisa. O gerador deixa de fora os termos que não cabem, a começar pelos últimos, e avisa quando o faz. As outras plataformas recebem todos os termos.
search.faq.remote.question=Como encontro empregos remotos na Europa?
search.faq.remote.answer=Adicione Europe, EMEA ou remote EU como localização e escolha Remoto como modalidade. O separador Portais de emprego remoto pesquisa sites que só publicam empregos remotos.
