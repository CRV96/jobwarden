# How each page works, which its header’s button opens
help.button=Como funciona
help.done=Percebi
howto.jobs.intro=Todas as vagas que acompanha: guardadas com a extensão do navegador, encontradas pelo assistente ou adicionadas à mão.
howto.jobs.1=Guarde anúncios com a extensão do navegador (Guardar, ou Candidatei-me), ou adicione um com Adicionar vaga.
howto.jobs.2=Pesquise por título ou empresa, filtre por estado e ordene por qualquer coluna. O endereço guarda as suas escolhas, por isso pode guardá-lo nos favoritos.
howto.jobs.3=Clique numa linha para abrir a vaga no painel lateral, ou no título para a sua própria página. O nome do site abre o anúncio.
howto.jobs.4=Marque linhas para arquivar ou apagar várias de uma vez. As vagas arquivadas saem da lista, do acompanhamento e do calendário; o filtro Arquivadas mostra-as, para as recuperar.
howto.jobs.5=A adequação diz até que ponto o seu CV corresponde à vaga, depois de o assistente a pontuar: de 4 para cima é uma boa adequação.
howto.jobs.tip=Definições → Os seus empregos exporta todas as vagas em CSV, importa as de outra ferramenta e arquiva as antigas de uma vez.
howto.job.intro=Tudo sobre uma vaga: o anúncio, o histórico e o que o assistente prepara para ela.
howto.job.1=Faça-a avançar com os botões de estado, ou acrescente ao histórico um passo com data: uma entrevista com hora, formato e local, uma rejeição com o motivo.
howto.job.2=Um estado diz-se uma vez: Vaga encerrada não pode seguir-se a Vaga encerrada. Se a vaga reabrir, marque-a Vaga reaberta; depois pode voltar a encerrar. As entrevistas e as ofertas podem repetir-se, em cada ronda.
howto.job.3=Peça ao assistente o que a vaga precisa, cada cartão por si: a adequação, um CV à prova de IA, uma carta de apresentação, mensagens para quem contrata, a preparação da entrevista e, na Oferta, como negociar. Cada um dá um prompt para colar no seu assistente, Claude Code ou Codex.
howto.job.4=Guarde com quem falar e quando fazer seguimento; defina lembretes para entrevistas e prazos.
howto.job.5=Os lápis corrigem a localização e o salário; o endereço do anúncio abre-o.
howto.job.6=Arquive a vaga quando terminar com ela: continua nas suas estatísticas e volta com Recuperar.
howto.job.tip=Recolha um cartão até ao título com a sua seta: esse cartão fica recolhido em todas as vagas.
howto.newJob.intro=Adicione uma vaga que encontrou sem a extensão do navegador, por exemplo por recomendação ou por um recrutador.
howto.newJob.1=Dê-lhe um título; o resto é opcional: a empresa, a localização, o salário, o link do anúncio e a descrição.
howto.newJob.2=Escolha em que ponto está, Guardada, Enviada ou mais à frente, e desde quando.
howto.newJob.3=Guarde-a: abre na sua própria página, onde o assistente a pode pontuar e adaptar o seu CV.
howto.newJob.tip=Com a extensão do navegador, guardar um anúncio é um clique, com a descrição e o logótipo.
howto.pipeline.intro=As suas vagas num quadro, uma coluna por estado.
howto.pipeline.1=Arraste um cartão para outra coluna para dar esse estado à vaga, como os botões do painel lateral.
howto.pipeline.2=Clique num cartão para abrir a vaga no painel lateral.
howto.pipeline.3=Escreva na pesquisa para limitar cada coluna às vagas cujo título ou empresa tem as palavras.
howto.pipeline.4=Uma coluna carrega mais cartões quando chega ao fim; o número por cima conta-os todos.
howto.pipeline.tip=As vagas arquivadas não estão no quadro: encontre-as em Vagas, em Arquivadas.
howto.calendar.intro=As suas entrevistas, mudanças de estado, prazos e dias de seguimento, por mês, semana ou dia.
howto.calendar.1=Mude entre mês, semana e dia, e avance com as setas ou Hoje.
howto.calendar.2=A legenda escolhe o que o calendário mostra: entrevistas, outras mudanças de estado, prazos, seguimentos.
howto.calendar.3=Clique numa entrada para abrir a vaga no painel lateral. Em breve lista os próximos 30 dias.
howto.calendar.4=O despertador junto a uma entrada de Em breve define um lembrete: à hora, ou antes.
howto.calendar.5=Subscrever adiciona o calendário ao Apple Calendar, ao Outlook ou ao Google Calendar. Escolha o que mostra, por exemplo só entrevistas e seguimentos: cada escolha tem o seu próprio endereço, por isso pode subscrever vários.
howto.calendar.tip=Quem tiver o endereço de um calendário pode lê-lo: Novo endereço desativa os antigos.
howto.inbox.intro=Os e-mails dos recrutadores, lidos da sua caixa, como novidades das suas vagas.
howto.inbox.1=Ligue a sua caixa uma vez, por IMAP com uma palavra-passe de aplicação. O JobWarden só a lê.
howto.inbox.2=Reconhece pelas palavras do e-mail uma rejeição, uma entrevista, uma oferta ou uma confirmação, e encontra a vaga pela empresa e pelo título.
howto.inbox.3=Aplique uma novidade para a pôr no histórico da vaga, escolha a vaga se não encontrou nenhuma, ou descarte-a. O que o histórico já diz não acrescenta nada.
howto.inbox.4=Em Definições → Caixa de entrada, escolha de quanto em quanto tempo lê, e se o JobWarden, ou o assistente, ordena as novidades sozinho.
howto.inbox.tip=Nada muda uma vaga sem si, a não ser que as Definições o digam.
howto.discover.intro=Onde o seu assistente de IA trabalha para si, através do servidor MCP do JobWarden, com a sua própria subscrição: Claude Code com Claude, ou Codex com ChatGPT.
howto.discover.1=Escolha o que o assistente deve fazer: encontrar vagas para o seu CV ou os seus requisitos, correr as pesquisas guardadas, verificar que anúncios encerraram, pontuar as suas vagas ou arrumar as que não têm resposta.
howto.discover.2=Cole o prompt no seu assistente, ou corra o comando num terminal; escolha Claude Code ou Codex nas definições. O ciclo que a página dá faz cada pedido sozinho, a cada poucos minutos.
howto.discover.3=As vagas que o assistente encontra esperam aqui como cartões, cada uma com o porquê: guarde-a, candidate-se ou descarte-a, com os botões ou o teclado.
howto.discover.4=Cada pedido mostra como correu e o que o assistente fez.
howto.discover.tip=O JobWarden não chama nenhuma IA e não precisa de chave de API; o que não precisa de IA, faz logo, de graça.
howto.search.intro=O Criador de pesquisas transforma o que procura em Warden Queries: pesquisas prontas para os sítios onde as vagas são publicadas, uma por plataforma.
howto.search.1=Descreva a vaga numa frase, por exemplo engenheiro backend sénior, remoto Europa, contrato, e clique em Preencher os filtros; ou preencha-os à mão.
howto.search.2=O quê: os títulos, as competências e as palavras a excluir. Onde: as localizações e regiões, e remoto, híbrido ou presencial. Que empregos: o tipo de contrato e quão recentes.
howto.search.3=Onde o Google procura: as páginas de carreiras das empresas, no Lever, Greenhouse, Ashby e semelhantes, onde as vagas aparecem muitas vezes primeiro. Acrescente um domínio seu, se quiser.
howto.search.4=À direita, uma Warden Query por plataforma: Google, LinkedIn, Reddit, X e os portais de emprego remoto. Os operadores, campos e expressões aparecem a cores.
howto.search.5=Copie uma consulta, ou clique em Abrir pesquisa para a correr num separador novo.
howto.search.6=Guardar pesquisa guarda os filtros com um nome. Filtros guardados volta a abri-los; a Lista de acompanhamento compara com eles as vagas novas das empresas; o assistente corre-os a partir da sua página.
howto.search.tip=O endereço guarda os filtros: guarde-o nos favoritos para voltar a uma pesquisa, ou partilhe-o.
howto.hiring.intro=Publicações de recrutadores e de responsáveis de contratação a dizer que estão a contratar, e as pessoas por trás delas.
howto.hiring.1=Peça ao assistente publicações sobre as funções e os locais que indicar: procura no LinkedIn, no X e no Reddit. O JobWarden não inicia sessão em lado nenhum.
howto.hiring.2=Descobrir mostra todas as publicações, as mais recentes primeiro, filtradas por data, país, hashtag ou palavras; A seguir, só as pessoas que segue.
howto.hiring.3=Siga um recrutador a partir de qualquer publicação sua, guarde uma publicação como vaga, ou esconda-a de vez.
howto.hiring.4=Recrutadores lista toda a gente, com a empresa e como chegaram. Peça ao assistente recrutadores para as suas funções, ou adicione um à mão.
howto.hiring.tip=Os contactos que guarda nas suas vagas aparecem aqui, seguidos; e o cartão Contactar de uma vaga escreve-lhes.
howto.cv.intro=O seu CV: o que o assistente lê para encontrar vagas, e a base de tudo o que escreve para si.
howto.cv.1=Carregue o seu CV, em PDF, Word ou texto, ou preencha os campos e o JobWarden cria um: pré-visualize-o e descarregue-o em PDF.
howto.cv.2=Guarde as suas histórias para entrevistas no banco de histórias, pelo método STAR, ou peça ao assistente que as esboce a partir do CV; complete as marcadas Por completar.
howto.cv.3=Ligue o GitHub, marque os repositórios que valem a pena mostrar e peça ao assistente que escreva os seus projetos a partir deles.
howto.cv.4=Os CV que o assistente adaptou a vagas aparecem aqui, cada um com o seu PDF.
howto.cv.tip=O assistente nunca acrescenta uma competência, um emprego ou um número que o seu CV não tenha.
howto.apply.intro=O assistente candidata-se por si às vagas guardadas, no seu próprio Chrome, com as suas próprias sessões: para isso é preciso o Claude Code com o Claude in Chrome.
howto.apply.1=Preencha as suas respostas uma vez: onde pode trabalhar, visto, pré-aviso, expectativa salarial, cartas de apresentação e as suas próprias perguntas.
howto.apply.2=Marque as vagas, escolha se o assistente envia cada formulário ou o preenche para o rever, e cole o prompt no Claude Code com o Claude in Chrome (claude --chrome). O Codex não consegue controlar o seu navegador.
howto.apply.3=Em cada vaga, o assistente adapta o seu CV, carrega-o com a carta de apresentação da vaga e responde só com as suas respostas: uma pergunta que elas não cobrem para a vaga e espera por si aqui.
howto.apply.4=Cada vaga mostra como correu; uma a que o assistente se candidatou passa a Enviada.
howto.apply.tip=O assistente salta o LinkedIn Easy Apply e os sites que proíbem candidaturas automáticas, e para num CAPTCHA para o resolver.
howto.offers.intro=As suas ofertas lado a lado, face ao que o mercado paga.
howto.offers.1=Quando uma vaga chega a Oferta, escreva as condições na sua página: salário base, bónus, ações, férias, data de início e prazo de resposta.
howto.offers.2=Escolha a moeda e o período, e a função e a linguagem com que comparar o mercado.
howto.offers.3=Cada coluna mostra o salário numa moeda, a distância ao mercado do seu país, a adequação e os dias que faltam para responder; a mais bem paga vai marcada.
howto.offers.4=Clique numa oferta para abrir a vaga, e pergunte ao assistente como a negociar: o que pedir, o mínimo a aceitar, o que dizer e um e-mail.
howto.offers.tip=Os números do mercado vêm da página Salários: carregue lá o inquérito do Stack Overflow para ter mais países.
howto.letters.intro=A carta de apresentação de cada vaga, e as suas mensagens a quem recruta, num só lugar.
howto.letters.1=Escreva a sua carta base uma vez: a sua voz e os parágrafos que usa sempre. Onde vão a empresa e o cargo, escreva {company} e {role}: cada vaga preenche-os.
howto.letters.2=Escolha uma vaga na lista: a sua carta e as mensagens abrem ao lado. Escreva a carta, partindo da sua carta base, ou peça ao assistente que a escreva a partir do seu CV e do anúncio.
howto.letters.3=Para várias de uma vez, marque as vagas sem carta e peça ao assistente: cole o único prompt no seu assistente, e ele escreve-as uma após a outra.
howto.letters.4=Altere qualquer carta, pré-visualize-a, copie-a, ou descarregue-a em PDF com o seu nome e contactos.
howto.letters.5=Por baixo da carta, Contactar guarda uma nota do LinkedIn e um e-mail para quem recruta para a vaga, para enviar você.
howto.letters.tip=O JobWarden nunca envia nada: as cartas e as mensagens envia-as você. As vagas terminadas só aparecem se tiverem carta.
howto.salaries.intro=O que as suas vagas pagam, comparado numa moeda, e o que o mercado paga.
howto.salaries.1=Escolha a moeda e o período: cada salário é convertido às taxas do Banco Central Europeu.
howto.salaries.2=Os números dão a mediana, a metade central e o mais alto; o gráfico, o intervalo de cada vaga.
howto.salaries.3=Um salário que o JobWarden não consegue ler aparece em baixo para corrigir; ou corrija-o com o lápis na página da vaga.
howto.salaries.4=Os salários de mercado comparam uma função e uma linguagem entre países, a partir do inquérito do Stack Overflow, dos anúncios da Adzuna e do Eurostat.
howto.salaries.tip=A Adzuna precisa de uma chave gratuita: adicione-a em Definições → Salários.
howto.statistics.intro=Como correram as suas candidaturas, contado a partir dos históricos das vagas, sem IA.
howto.statistics.1=A quantas se candidatou, quantas vezes houve resposta, entrevista ou oferta, e quanto tempo demoraram as respostas.
howto.statistics.2=Que sites, e quem se candidatou (o próprio, o assistente ou a extensão), tiveram mais respostas.
howto.statistics.3=Se as vagas que o assistente pontuou alto deram entrevistas mais vezes: quanto confiar nas pontuações.
howto.statistics.4=Os requisitos que mais lhe faltaram e porque foi rejeitado: no que trabalhar.
howto.statistics.tip=As vagas arquivadas continuam a contar aqui.
howto.settings.intro=O aspeto e a língua do JobWarden, a extensão do navegador, o assistente e os seus dados.
howto.settings.1=A foto do seu perfil, o tema e a língua.
howto.settings.2=Os seus empregos: exporte-os em CSV, importe os de outra ferramenta ou arquive os antigos de uma vez.
howto.settings.3=Caixa de entrada: de quanto em quanto tempo a sua caixa é lida, e o que acontece às novidades encontradas.
howto.settings.4=Extensão do navegador e Assistente IA: o endereço do servidor, o id do seu perfil, o assistente com que trabalha, Claude Code ou Codex, e como o ligar ao JobWarden.
howto.settings.5=Salários: a chave da Adzuna para os salários dos anúncios.
howto.settings.tip=Cada perfil tem as suas próprias vagas, o seu CV e as suas definições.
howto.profiles.intro=Os perfis separam procuras de emprego: a sua e a de um amigo, ou emprego fixo e freelance.
howto.profiles.1=Escolha um perfil para o abrir; o menu no fundo da barra lateral muda entre eles.
howto.profiles.2=Crie um com um nome: começa sem vagas, sem CV e com as suas próprias definições.
howto.profiles.tip=A extensão do navegador e o assistente precisam do id do perfil, que aparece por baixo do nome.
