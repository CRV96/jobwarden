<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main}, 'jobs')}">
<head>
    <title th:text="|#{newApplication.title} · JobWarden|">Add a job · JobWarden</title>
</head>
<body>
<!--/* Every field of an application added by hand; the list's dialog has the main ones. After invalid input the page
       is shown again: form holds what was typed, fieldErrors the error of each field. */-->
<main class="flex flex-col gap-4">
    <a class="btn btn-ghost self-start px-1.5 py-1" th:href="@{/applications}">
        <i class="ph ph-caret-left"></i><span th:text="#{nav.jobs}">Jobs</span>
    </a>
    <header>
        <h1 class="page-title mb-1" th:text="#{newApplication.title}">Add a job</h1>
        <p class="text-[13px] text-ink/60" th:text="#{newApplication.intro}">For a job you found without the browser extension, e.g. through a referral or a recruiter.</p>
    </header>

    <form class="card grid max-w-[640px] gap-3 p-4" method="post" th:action="@{/applications}">
        <div>
            <label class="field-label" for="title" th:text="#{newApplication.jobTitle}">Job title</label>
            <input id="title" class="input" type="text" name="title" required th:value="${form?.title}">
            <p class="field-error" th:if="${fieldErrors['title']}" th:text="${fieldErrors['title']}">Give the job a title.</p>
        </div>

        <div class="grid gap-3 sm:grid-cols-2">
            <div>
                <label class="field-label" for="company" th:text="#{newApplication.company}">Company</label>
                <input id="company" class="input" type="text" name="company" th:value="${form?.company}">
            </div>
            <div>
                <label class="field-label" for="location" th:text="#{newApplication.location}">Location</label>
                <input id="location" class="input" type="text" name="location" th:placeholder="#{newApplication.location.placeholder}"
                       th:value="${form?.location}">
            </div>
        </div>

        <div>
            <label class="field-label" for="link"><th:block th:text="#{newApplication.link}">Link to the posting</th:block>
                <span class="text-ink/50" th:text="#{newApplication.optional}">(optional)</span></label>
            <input id="link" class="input" type="url" name="link" placeholder="https://" th:value="${form?.link}">
            <p class="field-error" th:if="${fieldErrors['link']}" th:text="${fieldErrors['link']}">The link must be a full web address.</p>
        </div>

        <div class="grid gap-3 sm:grid-cols-2">
            <div>
                <label class="field-label" for="employmentType" th:text="#{newApplication.employmentType}">Employment type</label>
                <input id="employmentType" class="input" type="text" name="employmentType"
                       th:placeholder="#{newApplication.employmentType.placeholder}" th:value="${form?.employmentType}">
            </div>
            <div>
                <label class="field-label" for="salary" th:text="#{newApplication.salary}">Salary</label>
                <input id="salary" class="input" type="text" name="salary" th:value="${form?.salary}">
            </div>
        </div>

        <!--/* Starts the timeline: an application sent last week can be added as Applied, with last week’s date.
               The time is optional; after an error the form keeps what was typed, a cleared time included. */-->
        <div class="grid gap-3 sm:grid-cols-3">
            <div>
                <label class="field-label" for="status" th:text="#{newApplication.status}">Status</label>
                <select id="status" class="input" name="status" required>
                    <option th:each="status : ${statuses}" th:value="${status}" th:text="#{${'status.' + status}}"
                            th:selected="${form != null} ? ${status == form.status} : ${status.name() == 'APPLIED'}">Applied</option>
                </select>
                <p class="field-error" th:if="${fieldErrors['status']}" th:text="${fieldErrors['status']}">Pick a status.</p>
            </div>
            <div>
                <label class="field-label" for="statusDate" th:text="#{newApplication.since}">Since</label>
                <input id="statusDate" class="input" type="date" name="statusDate" required
                       th:value="${form?.statusDate} ?: ${now.toLocalDate()}">
                <p class="field-error" th:if="${fieldErrors['statusDate']}" th:text="${fieldErrors['statusDate']}">This value isn’t valid.</p>
            </div>
            <div>
                <label class="field-label" for="statusTime"><th:block th:text="#{newApplication.time}">Time</th:block>
                    <span class="text-ink/50" th:text="#{newApplication.optional}">(optional)</span></label>
                <!--/* See the timeline in fragments.html: the button empties the time completely. Keep it right after the input. */-->
                <span class="flex items-center gap-1.5">
                    <input id="statusTime" class="input min-w-0 flex-1" type="time" name="statusTime"
                           th:value="${form != null} ? ${form.statusTime} : ${#temporals.format(now, 'HH:mm')}">
                    <button class="btn btn-ghost" type="button" onclick="this.previousElementSibling.value = ''"
                            th:text="#{form.clearTime}">Clear time</button>
                </span>
                <p class="field-error" th:if="${fieldErrors['statusTime']}" th:text="${fieldErrors['statusTime']}">This value isn’t valid.</p>
            </div>
        </div>

        <div>
            <label class="field-label" for="description" th:text="#{newApplication.description}">Job description</label>
            <textarea id="description" class="input" name="description" rows="6" th:text="${form?.description}"></textarea>
        </div>

        <div>
            <button class="btn btn-primary" type="submit" th:text="#{addJob.save}">Save job</button>
        </div>
    </form>
</main>
</body>
</html>
