<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main}, 'jobs')}">
<head>
    <title th:text="|${jobApplication.title} · JobWarden|">Application · JobWarden</title>
</head>
<body>
<!--/* The model attribute is jobApplication: Thymeleaf reserves the name application for the servlet context.
       The same parts show in the side panel (drawer.html); both come from applications/fragments.html. */-->
<main class="flex flex-col gap-4">
    <!--/* Everything that changes when the timeline does. The forms inside post with HTMX and swap this whole element
           with the fragment the controller returns, so the status, the timeline and the forms all refresh. */-->
    <div id="application" th:fragment="application" class="flex flex-col gap-6"
         hx-target="this" hx-swap="outerHTML" hx-vals='{"view": "PAGE"}'
         th:with="eventsUrl=@{/applications/{id}/events(id=${jobApplication.id})}">
        <div class="flex flex-col gap-3">
            <a class="btn btn-ghost self-start px-1.5 py-1" th:href="@{/applications}">
                <i class="ph ph-caret-left"></i><span th:text="#{nav.jobs}">Jobs</span>
            </a>
            <header class="flex flex-wrap items-end gap-3">
                <span class="flex self-center">
                    <span th:replace="~{applications/fragments :: company-logo(${jobApplication.id}, ${jobApplication.company}, 40)}"></span>
                </span>
                <div class="flex min-w-[260px] flex-1 flex-col gap-1.5">
                    <div class="flex items-center gap-2">
                        <span class="text-sm text-ink/65" th:text="${jobApplication.company} ?: #{application.unknownCompany}">Acme</span>
                        <th:block th:replace="~{applications/fragments :: status-badge(${jobApplication.status})}">Applied</th:block>
                    </div>
                    <h1 class="page-title" th:text="${jobApplication.title}">Backend engineer</h1>
                </div>
                <div class="flex gap-1.5">
                    <button class="btn btn-secondary" type="button" th:data-open-dialog="|delete-${jobApplication.id}|">
                        <i class="ph ph-trash"></i><span th:text="#{action.delete}">Delete</span>
                    </button>
                    <!--/* Only http(s) links: the link comes from the captured page, and a javascript: link would run on click. */-->
                    <a class="btn btn-primary" th:if="${jobApplication.link != null and #strings.startsWith(jobApplication.link, 'http')}"
                       th:href="${jobApplication.link}" target="_blank" rel="noopener noreferrer">
                        <i class="ph ph-arrow-square-out"></i><span th:text="#{application.openPosting}">Open posting</span>
                    </a>
                </div>
            </header>
        </div>

        <div class="flex flex-wrap items-start gap-4">
            <div class="flex min-w-0 flex-[3_1_440px] flex-col gap-4">
                <div class="card p-4" th:if="${jobApplication.description}">
                    <section th:replace="~{applications/fragments :: description}"></section>
                </div>
                <div class="card p-4">
                    <section th:replace="~{applications/fragments :: timeline}"></section>
                </div>
            </div>
            <div class="flex max-w-full min-w-0 flex-[1_1_280px] flex-col gap-4">
                <div class="card flex flex-col gap-4 p-4">
                    <dl th:replace="~{applications/fragments :: facts}"></dl>
                    <div th:replace="~{applications/fragments :: status-picker}"></div>
                </div>
                <div class="card p-4">
                    <div th:replace="~{applications/fragments :: notes}"></div>
                </div>
            </div>
        </div>

        <dialog th:replace="~{applications/fragments :: delete-dialog}"></dialog>
    </div>
</main>
</body>
</html>
