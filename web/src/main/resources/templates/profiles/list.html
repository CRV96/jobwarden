<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title th:text="|#{profiles.title} · JobWarden|">Profiles · JobWarden</title>
</head>
<body>
<main>
    <h1 class="text-2xl font-semibold" th:text="#{profiles.heading}">Who’s using JobWarden?</h1>

    <p class="mt-2 text-gray-500" th:if="${#lists.isEmpty(profiles)}" th:text="#{profiles.empty}">No profiles yet. Create one to start tracking jobs.</p>

    <ul class="mt-6 flex flex-wrap gap-3" th:unless="${#lists.isEmpty(profiles)}">
        <li th:each="profile : ${profiles}">
            <form method="post" th:action="@{/profiles/{id}/select(id=${profile.id})}">
                <button class="rounded border px-4 py-2 hover:bg-gray-100" type="submit"
                        th:classappend="${currentProfile != null and currentProfile.id == profile.id} ? 'border-gray-900 bg-white font-semibold' : 'border-gray-300 bg-white'"
                        th:text="${profile.name}">Robert</button>
            </form>
        </li>
    </ul>

    <!--/* The id as text, so it shows 1000 and not 1,000 */-->
    <p class="mt-4 text-sm text-gray-500" th:if="${currentProfile}"
       th:text="#{profiles.idHint(${#strings.toString(currentProfile.id)})}">
        Your profile id is 1. The browser extension asks for it in its settings.</p>

    <form class="mt-8 flex gap-2" method="post" th:action="@{/profiles}">
        <input class="rounded border px-3 py-2" type="text" name="name" maxlength="100" required th:value="${name}"
               th:placeholder="#{profiles.newName}" th:aria-label="#{profiles.newName}">
        <button class="rounded bg-gray-900 px-4 py-2 text-white" type="submit" th:text="#{profiles.create}">Create profile</button>
    </form>
    <p class="mt-2 text-sm text-red-600" th:if="${nameError}" th:text="${nameError}">A profile named Robert already exists.</p>
</main>
</body>
</html>
