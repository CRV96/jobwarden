<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-bare :: bare(~{::title}, ~{::main})}">
<head>
    <title th:text="|#{unlock.title} · JobWarden|">Password · JobWarden</title>
</head>
<body>
<!--/* A profile with a password, chosen on the Profiles page or from the menu (ProfileController): its password opens
       it; a wrong one comes back here, with why. */-->
<main class="flex w-[min(340px,100%)] flex-col items-center gap-4 text-center">
    <span th:replace="~{profiles/list :: avatar(${unlockingProfile}, 'size-16 text-xl')}">R</span>
    <div>
        <h1 class="text-xl font-bold tracking-[-0.02em]" th:text="${unlockingProfile.name}">Robert</h1>
        <p class="flex items-center justify-center gap-1.5 text-[13px] text-ink/60">
            <i class="ph ph-lock-simple"></i><span th:text="#{unlock.subheading}">This profile has a password.</span>
        </p>
    </div>

    <form class="flex w-full flex-col gap-2" method="post" th:action="@{/profiles/{id}/unlock(id=${unlockingProfile.id})}">
        <label class="flex flex-col gap-1 text-left">
            <span class="field-label" th:text="#{unlock.password}">Password</span>
            <input class="input" type="password" name="password" required autofocus autocomplete="current-password"
                   th:aria-invalid="${unlockError != null} ? 'true'">
        </label>
        <p class="field-error text-left" role="alert" th:if="${unlockError}" th:text="${unlockError}">That isn’t the password.</p>
        <button class="btn btn-primary justify-center" type="submit">
            <i class="ph ph-lock-simple-open"></i><span th:text="#{unlock.submit}">Open the profile</span>
        </button>
    </form>

    <a class="link text-[13px]" th:href="@{/profiles}" th:text="#{unlock.back}">Choose another profile</a>
</main>
</body>
</html>
