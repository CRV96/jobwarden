<!DOCTYPE html>
<!--/* Rendered by Spring Boot for every error on a page (404, 500, ...). It provides ${status} and ${error}. */-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main}, null)}">
<head>
    <title th:text="|#{errorPage.title} · JobWarden|">Error · JobWarden</title>
</head>
<body>
<main class="flex flex-col items-start gap-1.5 py-6">
    <i class="ph ph-warning-circle text-[28px] text-accent"></i>
    <p class="text-xs font-semibold text-ink/60 tabular-nums" th:text="${status}">500</p>
    <h1 class="page-title" th:text="${status == 404} ? #{errorPage.notFound} : #{errorPage.generic}">Something went wrong</h1>
    <a class="link mt-3 text-[13px]" th:href="@{/applications}" th:text="#{errorPage.back}">Back to your jobs</a>
</main>
</body>
</html>
