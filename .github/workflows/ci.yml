name: CI

# One run for every pull request, every push to main and every release tag, with all of the checks in it, each after
# what it needs:
#
# - build: compiles every module with Error Prone and NullAway, checks the imports and the JavaScript (ESLint), builds
#   the CSS and packages the jar, without running the tests. The rest waits for it.
# - test, then sonar: all the tests, with JaCoCo measuring what they cover; then SonarCloud's analysis of the code with
#   that coverage, waiting for the quality gate's verdict.
# - docker, beside test: builds the image.
# - publish, on main and tags, once the tests and the image passed: the image, to GitHub's container registry. Then
#   release, on tags: the GitHub release, with the jar and the extension.
# - dependency-review (pull requests) and codeql, from the start.
#
# CodeRabbit isn't a job: it's a GitHub App, whose review shows among the pull request's checks next to these. The
# actions are pinned to a commit; Dependabot keeps them up to date.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its run that's still going. On main and tags, a run that may be publishing
# finishes, and the next one waits for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The names build, test, docker and dependency-review are the checks the "Protect Main" ruleset requires
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # A tag, the Maven projects and the extension's manifest must say the same version (see VersionTests)
      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          maven="$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          extension="$(jq -r .version extension/manifest.json)"
          if [ "$tag" != "$maven" ] || [ "$tag" != "$extension" ]; then
            echo "::error::The tag says $tag, the Maven projects $maven and the extension $extension"
            exit 1
          fi
      # The nullaway profile turns itself on in CI (GitHub Actions sets CI)
      - name: Build
        run: ./mvnw -B verify -DskipTests
      - name: Keep the jar, for the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar
          path: app/target/jobwarden-app-*.jar
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Every test: the module boundaries and the conventions among them. Testcontainers uses the Docker that GitHub's
      # Ubuntu runners come with. Without Error Prone, which build ran already.
      - name: Test
        run: ./mvnw -B verify -P 'coverage,!nullaway'
      - name: Keep what the tests covered, for the analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            app/target/site/jacoco-aggregate/jacoco.xml
            */target/surefire-reports/
          retention-days: 1
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: '*/target/surefire-reports/'
          retention-days: 7

  sonar:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarCloud reads the history to tell new code from old
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      # Only with the SONAR_TOKEN secret (pull requests from forks don't get it), and with Automatic Analysis turned off
      # in SonarCloud, as the two can't both analyze the project. The analysis reads the compiled classes, so they're
      # compiled again (in the same run of Maven, which is how one module finds another's); the CSS isn't needed. The
      # organization and the project are the pom's, unless the secrets of those names say otherwise.
      - name: SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: >-
          ./mvnw -B -P '!nullaway' -Dskip.installnodenpm -Dskip.npm
          test-compile org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true
          ${SONAR_ORGANIZATION:+-Dsonar.organization=$SONAR_ORGANIZATION}
          ${SONAR_PROJECT_KEY:+-Dsonar.projectKey=$SONAR_PROJECT_KEY}

  # The image is built from the sources (Dockerfile), as anyone would build it; its layers are cached for publish
  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # main publishes the image as edge, and a tag like v0.2.0 as 0.2.0, 0.2 and latest: each with its SBOM, and an
  # attestation of the commit and workflow it was built from (gh attestation verify). From docker's cache, it's the
  # same image, built again in a minute.
  publish:
    if: github.event_name == 'push'
    needs: [test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The registry wants it in lower case: ghcr.io/crv96/jobwarden
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to the registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - name: Attest where the image was built from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # A tag like v0.2.0 publishes that version: a GitHub release with build's jar, the extension's zip and a compose.yaml
  # that runs the version's image (publish) with PostgreSQL, each attested as built here from that tag, and notes that
  # say how to run it and how to upgrade, keeping the data. Running JobWarden servers see it within a day (the updates
  # module asks GitHub for the latest release), and say so in the sidebar, the settings and the extension's popup.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jar
          path: app/target
      - name: Package the extension
        run: cd extension && zip -r "../jobwarden-extension-${GITHUB_REF_NAME#v}.zip" . -x '.*' '*/.*'
      # deploy/compose.yaml, its image this version's unless JOBWARDEN_VERSION says another
      - name: Pin the compose file to this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/JOBWARDEN_VERSION:-latest/JOBWARDEN_VERSION:-${version}/" deploy/compose.yaml > compose.yaml
          grep -q "JOBWARDEN_VERSION:-${version}}" compose.yaml
      - name: Attest where they were built from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            app/target/jobwarden-app-*.jar
            jobwarden-extension-*.zip
            compose.yaml
      # Above the notes GitHub makes from the pull requests
      - name: Write the release notes
        run: |
          cat > notes.md <<'NOTES'
          ## Running it with Docker

          The image is `@IMAGE@:@VERSION@` (also `@MINOR@` and `latest`), attested as built from this tag: `gh attestation verify oci://@IMAGE@:@VERSION@ --repo @REPO@`.

          **New:** download `compose.yaml` below, run `docker compose up -d` next to it, and open http://localhost:9273.

          **Upgrading, keeping your data:** back up first ([Backups](https://github.com/@REPO@/wiki/Updating#back-up-first)), then put this release's `compose.yaml` in place of yours (or set `JOBWARDEN_VERSION=@VERSION@`), and next to it:

          ```bash
          docker compose pull && docker compose up -d
          ```

          The database and the key are in Docker volumes, never in the containers: the new JobWarden container takes them over, and upgrades the schema as it starts. Then reload the browser extension, from its zip below.

          NOTES
          version="${GITHUB_REF_NAME#v}"
          sed -i "s|@IMAGE@|ghcr.io/${GITHUB_REPOSITORY,,}|g; s|@VERSION@|${version}|g; s|@MINOR@|${version%.*}|g; s|@REPO@|${GITHUB_REPOSITORY}|g" notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "JobWarden ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            --generate-notes "app/target/jobwarden-app-${GITHUB_REF_NAME#v}.jar" \
            "jobwarden-extension-${GITHUB_REF_NAME#v}.zip" compose.yaml

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Says on the pull request what it found, when it fails
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # Code scanning of the Java, the JavaScript and these workflows, from the sources (no build needed). Its alerts are
  # what the ruleset's code scanning rule holds a pull request to. It needs CodeQL's default setup turned off in the
  # repository's settings (Code security): GitHub takes one or the other.
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
