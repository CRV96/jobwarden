name: Release

# Pushing a tag like v0.2.0 publishes that version: a GitHub release with the app's jar and the extension's zip.
# Running JobWarden servers see it within six hours (the updates module asks GitHub for the latest release), and say
# so in the sidebar, the settings and the extension's popup.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # The tag, the Maven projects and the extension's manifest must say the same version (see VersionTests)
      - name: Check the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          maven="$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          extension="$(jq -r .version extension/manifest.json)"
          if [ "$tag" != "$maven" ] || [ "$tag" != "$extension" ]; then
            echo "::error::The tag says $tag, the Maven projects $maven and the extension $extension"
            exit 1
          fi
      - name: Build and test
        run: ./mvnw -B verify
      - name: Package the extension
        run: cd extension && zip -r "../jobwarden-extension-${GITHUB_REF_NAME#v}.zip" . -x '.*'
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "JobWarden ${GITHUB_REF_NAME#v}" --generate-notes \
            "app/target/jobwarden-app-${GITHUB_REF_NAME#v}.jar" "jobwarden-extension-${GITHUB_REF_NAME#v}.zip"
