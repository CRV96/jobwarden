name: Release

# Pushing a tag like v0.2.0 publishes that version: a GitHub release with the app's jar and the extension's zip, each
# attested as built here from that tag (gh attestation verify). The Docker image of the tag comes from docker.yml.
# Running JobWarden servers see it within six hours (the updates module asks GitHub for the latest release), and say
# so in the sidebar, the settings and the extension's popup.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # The tag, the Maven projects and the extension's manifest must say the same version (see VersionTests)
      - name: Check the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          maven="$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          extension="$(jq -r .version extension/manifest.json)"
          if [ "$tag" != "$maven" ] || [ "$tag" != "$extension" ]; then
            echo "::error::The tag says $tag, the Maven projects $maven and the extension $extension"
            exit 1
          fi
      - name: Build and test
        run: ./mvnw -B verify
      - name: Package the extension
        run: cd extension && zip -r "../jobwarden-extension-${GITHUB_REF_NAME#v}.zip" . -x '.*'
      - name: Attest where they were built from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            app/target/jobwarden-app-*.jar
            jobwarden-extension-*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "JobWarden ${GITHUB_REF_NAME#v}" --generate-notes \
            "app/target/jobwarden-app-${GITHUB_REF_NAME#v}.jar" "jobwarden-extension-${GITHUB_REF_NAME#v}.zip"
