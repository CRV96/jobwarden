name: Feature request
description: An idea for JobWarden
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What it would help with
      description: The part of the job hunt that's harder than it should be today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How JobWarden could help, and where it would show.
    validations:
      required: true
