# Messages users see for the hiring module's errors, in English. Also the fallback for languages the app doesn't have.
# Translations are in the files with a language suffix; MessageBundlesTests checks they all have the same keys.
# {0}, {1}... are the exception's arguments. Write apostrophes as ’: next to placeholders, ' is a quote character.

error.HIRING-001=Recruiter {0} doesn’t exist.
error.HIRING-002=Post {0} doesn’t exist.
error.HIRING-003=A recruiter’s profile must be a web address, e.g. https://www.linkedin.com/in/name.
