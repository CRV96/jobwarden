# Messages users see for the discover module's errors, in English. Also the fallback for languages the app doesn't have.
# Translations are in the files with a language suffix; MessageBundlesTests checks they all have the same keys.
# {0}, {1}... are the exception's arguments. Write apostrophes as ’: next to placeholders, ' is a quote character.

error.DISCOVER-001=Found job {0} doesn’t exist.
error.DISCOVER-002=Saved search {0} doesn’t exist.
error.DISCOVER-003=A saved search needs a name.
error.DISCOVER-004=Request {0} doesn’t exist.
error.DISCOVER-005=Request {0} is already finished.
