<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JobWarden</title>
    <!-- The app's look (ui.css), and what's the popup's own -->
    <link rel="stylesheet" href="ui.css">
    <style>
        html, body { background: var(--jw-sidebar); }
        body { width: 340px; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 10px; }
        main { display: flex; flex-direction: column; gap: 12px; padding: 0 14px 14px; }

        /* The application this page is already saved as: its status in its colour (st-*), the job, since when */
        #card { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; }
        #card .job { font-weight: 600; line-height: 1.35; }

        /* What extract.js found, to correct before saving */
        #capture { display: flex; flex-direction: column; gap: 10px; padding: 12px; }

        .actions { display: flex; gap: 8px; }
        /* Two to a row, their labels wrapping in the longer languages */
        .actions .btn { flex: 1; min-width: 0; white-space: normal; text-align: center; }
        .actions:not(:has(> :not([hidden]))) { display: none; }
        .confirm { flex-direction: column; gap: 10px; padding: 10px 12px; }
        .confirm:not([hidden]) { display: flex; }

        .links { display: flex; align-items: center; gap: 12px; }
        .links:not(:has(> :not([hidden]))) { display: none; }
        .links .btn { padding: 0; }

        /* A newer JobWarden is out, or the server runs a newer one than this extension */
        #update { text-decoration: none; }
        a#update:hover { text-decoration: underline; }

        /* On a LinkedIn job search: the Easy Apply run */
        #run { display: flex; flex-direction: column; gap: 8px; }
        #run h2 { display: flex; align-items: center; gap: 6px; }
        #run h2 .icon { color: var(--jw-accent); font-size: 15px; }
        #run-options, #run-going { display: flex; flex-direction: column; gap: 10px; }
        #run-options[hidden], #run-going[hidden] { display: none; }
        .limit { display: flex; align-items: center; gap: 8px; }
        .limit .input { width: 64px; }
    </style>
</head>
<body>
<header>
    <h1 class="brand">
        <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="icons/phosphor.svg#shield-check"/></svg></span>
        JobWarden
    </h1>
    <!-- Opens the settings page (the server and the profile). Its title also says which ones are in use. -->
    <button id="settings" class="btn btn-icon" type="button">
        <svg class="icon" aria-hidden="true"><use href="icons/phosphor.svg#gear-six"/></svg>
    </button>
</header>

<main>
    <!-- Shown when there's a newer JobWarden: a link to its release, or what to do -->
    <a id="update" class="note" target="_blank" rel="noopener" hidden></a>

    <!-- When JobWarden already has this page: which job, and where it's at -->
    <section id="card" class="card" hidden>
        <p><span class="tag"><svg class="icon" id="card-mark" aria-hidden="true"><use href=""/></svg><span id="card-status"></span></span></p>
        <p class="job" id="card-job"></p>
        <p class="hint" id="card-when"></p>
    </section>

    <!-- When it doesn't: what extract.js found, for the user to correct before saving -->
    <form id="capture" class="card" hidden>
        <label class="field">
            <span class="field-label" data-i18n="jobTitle">Job title</span>
            <input class="input" type="text" name="title" required>
        </label>
        <label class="field">
            <span class="field-label" data-i18n="company">Company</span>
            <input class="input" type="text" name="company">
        </label>
        <label class="field">
            <span class="field-label" data-i18n="location">Location</span>
            <input class="input" type="text" name="location">
        </label>
        <label class="field">
            <span class="field-label" data-i18n="description">Job description</span>
            <textarea class="input" name="description" rows="4" data-i18n-placeholder="descriptionPlaceholder"></textarea>
        </label>
    </form>

    <!-- For I applied -->
    <label class="checkbox" id="include-time-option" hidden>
        <input class="check" type="checkbox" id="include-time">
        <span data-i18n="includeTime">Include the time</span>
    </label>

    <!-- Which buttons show depends on the state. None submits the form: Enter in a field would click it. -->
    <div class="actions" id="actions">
        <button class="btn btn-primary" type="button" id="apply" data-i18n="apply" hidden>I applied</button>
        <button class="btn btn-secondary" type="button" id="bookmark" data-i18n="bookmark" hidden>Bookmark</button>
        <button class="btn btn-secondary" type="button" id="move-back" data-i18n="moveBackToBookmarks" hidden>Move back to bookmarks</button>
        <button class="btn btn-ghost btn-ghost-danger" type="button" id="remove" hidden></button>
    </div>

    <div class="note note-danger confirm" id="confirm" hidden>
        <p id="confirm-question"></p>
        <div class="actions">
            <button class="btn btn-danger" type="button" id="confirm-remove" data-i18n="remove">Remove</button>
            <button class="btn btn-secondary" type="button" id="cancel-remove" data-i18n="cancel">Cancel</button>
        </div>
    </div>

    <p id="status" class="status" role="status"></p>
    <div class="links">
        <a id="open-application" class="link" target="_blank" hidden data-i18n="openApplication">Open in JobWarden</a>
        <button id="open-settings" class="btn btn-ghost" type="button" hidden data-i18n="openSettings">Open settings</button>
    </div>

    <!-- On a LinkedIn job search: start the Easy Apply run (runs.js), or stop the one going on in the tab -->
    <section id="run" hidden>
        <hr class="rule-fade">
        <h2 class="section-title">
            <svg class="icon" aria-hidden="true"><use href="icons/phosphor.svg#lightning"/></svg>
            <span data-i18n="runTitle">Easy Apply run</span>
        </h2>
        <p class="hint" data-i18n="runHint">Goes through this search and sends each Easy Apply job.</p>
        <div id="run-options">
            <label class="limit">
                <span data-i18n="runLimit">Stop after</span>
                <input class="input" type="number" id="run-limit" min="1" max="100" required>
                <span data-i18n="runLimitUnit">applications</span>
            </label>
            <label class="checkbox">
                <input class="check" type="checkbox" id="run-save-others">
                <span data-i18n="runSaveOthers">Save the other jobs for Auto-apply</span>
            </label>
            <p class="note note-warning">
                <svg class="icon" aria-hidden="true"><use href="icons/phosphor.svg#warning"/></svg>
                <span data-i18n="runWarning">LinkedIn’s terms don’t allow automated applying.</span>
            </p>
            <div class="actions">
                <button class="btn btn-primary" type="button" id="run-start" data-i18n="runStart">Start the run</button>
            </div>
        </div>
        <div id="run-going" hidden>
            <p id="run-going-text"></p>
            <div class="actions">
                <button class="btn btn-danger" type="button" id="run-stop" data-i18n="runStopButton">Stop the run</button>
            </div>
        </div>
    </section>
</main>

<script type="module" src="popup.js"></script>
</body>
</html>
