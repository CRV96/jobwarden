# Messages users see for the apply module's errors, in English. Also the fallback for languages the app doesn't have.
# Translations are in the files with a language suffix; MessageBundlesTests checks they all have the same keys.
# {0}, {1}... are the exception's arguments. Write apostrophes as ’: next to placeholders, ' is a quote character.

error.APPLY-001=Job {0} isn’t queued for Claude.
error.APPLY-002=Claude is done with job {0}: it can’t change any more.
error.APPLY-003={0} isn’t what Claude can report: FILLED, APPLIED, NEEDS_ANSWER, SKIPPED or FAILED.
